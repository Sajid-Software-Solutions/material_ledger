name: material_ledger
description: "Construction Material Ledger — The Architectural Ledger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Typography
  google_fonts:

  # UI Utilities
  gap:
  flutter_svg: ^2.0.17
  cupertino_icons: ^1.0.8

  # Utilities
  intl:

  # Persistence
  shared_preferences:

  # UUID generation
  uuid: ^4.5.1
  printing: ^5.15.0
  pdf: ^3.13.0
  crypto: ^3.0.7
  package_info_plus: ^10.1.0
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  local_auth: ^3.0.1
  # Licensed pure-Dart OOXML/XLSX parsing and generation for BOQ round-trips.
  archive: ^4.0.7
  xml: ^7.0.1
  # Flutter-maintained native and browser XLSX selection/save dialogs.
  file_selector: ^1.1.0
  # Browser drag-and-drop target for optional project documents. The picker
  # remains the cross-platform path; this adds the expected desktop workflow.
  flutter_dropzone: ^4.2.1
  # Crash & error monitoring — only active when a SENTRY_DSN is supplied at
  # build time (--dart-define); otherwise the app uses NoopObservability.
  sentry_flutter: ^9.0.0
  # Privacy-guarded product analytics. Runtime setup is manual and opt-in;
  # native/web autocapture and session replay remain disabled.
  posthog_flutter: ^5.39.0
  # Backend (self-hosted Supabase / Postgres in a UAE region). Only active when
  # SUPABASE_URL + SUPABASE_ANON_KEY are supplied at build time (--dart-define);
  # release startup fails closed. Local mode requires explicit development
  # defines and is never a production fallback.
  supabase_flutter: ^2.5.0
  # Push notification TRANSPORT ONLY (Supabase remains the backend/auth/db).
  # A no-op until google-services.json / GoogleService-Info.plist are added —
  # Firebase.initializeApp() is wrapped so a missing/misconfigured project
  # never blocks app boot.
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Icon generation (build-time only)
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0
  shared_preferences_platform_interface: ^2.4.2

# App launcher icon: the approved complete black Yorks seal. The source is
# normalized by tool/prepare_branding.dart, then this turns it into all
# platform sizes.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#041E42"
    theme_color: "#041E42"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/branding/source_emblem.png
    - assets/branding/yorks_emblem_web.png
    - assets/branding/yorks_emblem_black.png
    - assets/branding/yorks_emblem_mobile.png

  fonts:
    - family: NexusSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
