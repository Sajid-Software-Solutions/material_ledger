<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yorks Airconditioning & Refrigeration LLC-SPC — controlled projects, materials, procurement and documents.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yorks AC. & Ref.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=black-20260906">

  <!-- The signed-in shell paints this small seal immediately. Preload its
       display-sized rendition so it does not compete with the engine after
       the first Flutter frame has been scheduled. The document/native PNG
       remains separate and is loaded only by document workflows. -->
  <!-- Fonts download in parallel with main.dart.js instead of after it. They
       match the engine's same-origin fetch, so the preloaded copy is reused. -->
  <link rel="preload" href="assets/assets/fonts/NotoSans-Regular.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/NotoSans-Bold.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/NotoSansArabic-Regular.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/branding/yorks_emblem_web.png" as="image" type="image/png" fetchpriority="high">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=black-20260906"/>

  <title>Yorks AC. & Ref.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter owns inspection zoom so magnification never changes breakpoints
       or rearranges the Yorks workspace. */
    html, body, #yorks-app, flutter-view, flt-glass-pane {
      touch-action: none !important;
    }

    #yorks-app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      background: #041E42;
    }

    #yorks-boot {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 24px;
      color: #FFFFFF;
      background:
        radial-gradient(circle at 50% 38%, rgba(22, 119, 255, 0.18), transparent 34%),
        linear-gradient(145deg, #041E42 0%, #00183A 55%, #000E26 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 140ms ease-out;
    }

    #yorks-boot[hidden] {
      display: none;
    }

    .yorks-boot-card {
      display: grid;
      justify-items: center;
      gap: 16px;
      text-align: center;
    }

    .yorks-boot-logo {
      width: 88px;
      height: 88px;
      overflow: hidden;
      border-radius: 999px;
      background: #FFFFFF;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
    }

    .yorks-boot-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .yorks-boot-title {
      margin: 0;
      font-size: 23px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .yorks-boot-status {
      min-height: 22px;
      margin: 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 14px;
    }

    .yorks-boot-pulse {
      width: 42px;
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.16);
    }

    .yorks-boot-pulse::after {
      display: block;
      width: 52%;
      height: 100%;
      border-radius: inherit;
      background: #3B97FF;
      content: "";
      animation: yorks-boot-pulse 900ms ease-in-out infinite alternate;
    }

    #yorks-boot-retry {
      display: none;
      min-width: 112px;
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 10px;
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    html[data-yorks-boot-failed="true"] #yorks-boot-retry {
      display: block;
    }

    html[data-yorks-boot-failed="true"] .yorks-boot-pulse {
      display: none;
    }

    @keyframes yorks-boot-pulse {
      from { transform: translateX(-42%); opacity: 0.58; }
      to { transform: translateX(92%); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #yorks-boot { transition: none; }
      .yorks-boot-pulse::after { animation: none; transform: none; }
    }
  </style>
</head>
<body>
  <div id="yorks-app"></div>
  <div id="yorks-boot" role="status" aria-live="polite" aria-busy="true">
    <div class="yorks-boot-card">
      <div class="yorks-boot-logo" aria-hidden="true">
        <img src="assets/assets/branding/yorks_emblem_web.png" alt="">
      </div>
      <h1 class="yorks-boot-title">Yorks AC. &amp; Ref.</h1>
      <p class="yorks-boot-status" data-yorks-boot-status>Opening Yorks…</p>
      <div class="yorks-boot-pulse" aria-hidden="true"></div>
      <button id="yorks-boot-retry" type="button">Retry</button>
    </div>
  </div>
  <script>
    // Manual PostHog web bootstrap. Dart calls this only when the build has an
    // explicit valid POSTHOG_* configuration. No page view, DOM interaction,
    // URL, user-visible text, replay frame, survey, or exception is captured.
    window.yorksPostHogBootstrap = (projectToken, apiHost, debug) => {
      if (!projectToken || !apiHost || window.posthog?.__loaded) return;

      ((document, posthog) => {
        if (posthog.__SV) return;
        window.posthog = posthog;
        posthog._i = [];
        posthog.init = (token, config, name) => {
          const method = (target, key) => {
            const parts = key.split('.');
            if (parts.length === 2) {
              target = target[parts[0]];
              key = parts[1];
            }
            target[key] = (...args) => target.push([key, ...args]);
          };
          const script = document.createElement('script');
          script.type = 'text/javascript';
          script.crossOrigin = 'anonymous';
          script.async = true;
          const assetHost = config.api_host.includes('.i.posthog.com')
            ? config.api_host.replace('.i.posthog.com', '-assets.i.posthog.com')
            : config.api_host;
          script.src = assetHost + '/static/array.js';
          const firstScript = document.getElementsByTagName('script')[0];
          firstScript.parentNode.insertBefore(script, firstScript);
          let instance = posthog;
          if (name !== undefined) instance = posthog[name] = [];
          else name = 'posthog';
          instance.people = instance.people || [];
          instance.toString = (stub) =>
            `${name === 'posthog' ? 'posthog' : `posthog.${name}`}${stub ? '.people (stub)' : ' (stub)'}`;
          instance.people.toString = () => `${instance.toString(true)}.people (stub)`;
          [
            'capture', 'identify', 'alias', 'reset', 'screen', 'group',
            'setPersonProperties', 'people.set',
            'people.set_once', 'getFeatureFlag', 'getFeatureFlagPayload',
            'getFeatureFlagResult', 'isFeatureEnabled', 'reloadFeatureFlags',
            'onFeatureFlags', 'register', 'unregister', '_overrideSDKInfo',
            'set_config', 'debug', 'opt_in_capturing', 'opt_out_capturing',
            'has_opted_in_capturing', 'has_opted_out_capturing',
          ].forEach((key) => method(instance, key));
          posthog._i.push([token, config, name]);
        };
        posthog.__SV = 1;
      })(document, window.posthog || []);

      const removeSensitiveContext = (properties) => {
        if (!properties || typeof properties !== 'object') return properties;
        [
          '$current_url', '$pathname', '$host', '$referrer',
          '$referring_domain', '$title', '$raw_user_agent',
        ].forEach((key) => delete properties[key]);
        return properties;
      };
      const sensitiveContextKeys = [
        '$current_url', '$pathname', '$host', '$referrer',
        '$referring_domain', '$title', '$raw_user_agent',
      ];
      window.posthog.init(projectToken, {
        api_host: apiHost,
        defaults: '2026-05-30',
        autocapture: false,
        capture_pageview: false,
        capture_pageleave: false,
        capture_dead_clicks: false,
        capture_exceptions: false,
        capture_heatmaps: false,
        capture_performance: false,
        disable_session_recording: true,
        disable_surveys: true,
        rageclick: false,
        mask_all_text: true,
        mask_all_element_attributes: true,
        person_profiles: 'identified_only',
        persistence: 'localStorage',
        property_denylist: sensitiveContextKeys,
        sanitize_properties: removeSensitiveContext,
        before_send: (event) => {
          if (event?.properties) removeSensitiveContext(event.properties);
          return event;
        },
        loaded: (client) => { if (debug) client.debug(); },
      });
    };
    window.yorksPostHogFeatureEnabled = (key) => Boolean(
      window.posthog?.__loaded &&
      window.posthog.isFeatureEnabled(key, {
        send_event: false,
        defaultValue: false,
      })
    );
  </script>
  <script>
    // Keep browser page zoom from competing with Yorks' fixed-layout workspace
    // zoom. The events continue to Flutter, which applies the composited scale.
    // Ordinary keyboard and wheel input remains untouched.
    (() => {
      window.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && !event.altKey &&
            ['+', '=', '-', '_', '0'].includes(event.key)) {
          event.preventDefault();
        }
      }, { capture: true });
      window.addEventListener('wheel', (event) => {
        if (event.ctrlKey || event.metaKey) event.preventDefault();
      }, { capture: true, passive: false });

      const boot = document.getElementById('yorks-boot');
      const retry = document.getElementById('yorks-boot-retry');
      retry?.addEventListener('click', () => window.location.reload());
      window.addEventListener('flutter-first-frame', () => {
        if (!boot) return;
        boot.setAttribute('aria-busy', 'false');
        boot.style.opacity = '0';
        window.setTimeout(() => boot.remove(), 160);
      }, { once: true });

      window.setTimeout(() => {
        if (!boot || !document.body.contains(boot)) return;
        document.documentElement.dataset.yorksBootFailed = 'true';
        const status = boot.querySelector('[data-yorks-boot-status]');
        if (status) status.textContent = 'Yorks is taking longer than expected.';
      }, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
