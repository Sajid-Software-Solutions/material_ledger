<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yorks Workforce Attendance</title>
<!--
  Yorks AC. & Ref. — Workforce attendance prototype (9 November 2026).
  Replaces the paper DAILY TIME SHEET (IN / BRK / IN / OUT, overtime NOR / HOL,
  project name, weekly site in-charge signature).

  Stakeholder roles in this prototype:
    • Attendance taker    — anyone assigned to a crew (here a Site Engineer, Project Engineer or the
                            Workshop In-Charge). Enters today or any earlier day of the month.
    • Site Engineer       — attendance taker for a site crew.
    • Project Engineer    — supervises Site Engineers. No daily approval: sees every entry as it happens,
                            can change a day (with a reason) or ask a question, and confirms the
                            month after the 30 Nov notification. Can also take attendance.
    • Workshop In-Charge  — takes workshop attendance; NO review or month confirmation.
    • PR (new role)       — its own role, to be added. Read only: Workforce Overview, Monthly sheets,
                            Projects Overview, Rental System.
    • Accountant          — read only: Workforce Overview and Monthly sheets, with CSV export.

  Sections (search for the SECTION markers below):
    SECTION: Workforce Overview · SECTION: Attendance capture · SECTION: Month confirmation
    SECTION: Monthly sheets · SECTION: Projects Overview (read only) · SECTION: Rental System (read only)

  No server, no database, no external libraries. Demo data lives in this browser
  only (localStorage) and "Reset demo" restores it.
  [FILL: any extra functionality or design preferences]
-->
<style>

:root{
  --bg:#EEF3F8;--mbg:#F3F6FA;--chrome:#F9FBFD;--card:#fff;
  --line:#E0E6ED;--line2:#EDF1F6;--lineS:#C8D2DF;--cardb:#D8E2EE;
  --ink:#132033;--ink2:#34435A;--mut:#6B788C;--mut2:#8F9AAE;--navy:#0D2F57;--navyH:#123F73;
  --pri:#1D68D9;--pri-d:#1757B8;--pri-50:#EAF2FF;--pri-100:#C9DCFF;
  --ok:#0D8B63;--ok-50:#E9F8F2;--okI:#2E9A63;
  --warn:#AD6A00;--warn-50:#FFF5DF;--org:#D2742C;
  --bad:#C23737;--bad-50:#FFF0F0;
  --vio:#6D4BD1;--vio-50:#F2EDFF;
  --neu:#F1F4F7;--neuT:#536175;
  --r:14px;--gap:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== prototype bar (not part of the app) ===== */
#pbar{position:sticky;top:0;z-index:80;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(13,47,87,.25)}
.pb-in{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.pb-tag{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;white-space:nowrap;margin-right:4px}
.pb-tag small{font-weight:500;opacity:.7}
.pb-roles{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:0}
.pr{height:30px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:0 10px;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pr:hover{background:rgba(255,255,255,.14)}
.pr.on{background:#fff;color:var(--navy);border-color:#fff}
.pr-n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16)}
.pr.on .pr-n{background:var(--pri-50);color:var(--pri)}
.pb-sel{display:none;flex:1;min-width:160px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font-weight:600}
.pb-sel option{color:var(--ink)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:2px;gap:2px}
.seg button{height:28px;border:0;background:none;color:#fff;border-radius:8px;padding:0 10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy)}
.seg svg.i{width:15px;height:15px}
.pb-btn{height:32px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:9px;padding:0 12px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pb-btn.on{background:#fff;color:var(--navy)}
.pb-btn svg.i{width:15px;height:15px}

/* ===== shell (same as live Yorks web) ===== */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:calc(100vh - var(--pb,48px))}
.app.open{grid-template-columns:246px minmax(0,1fr)}
.side{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:var(--pb,48px);height:calc(100vh - var(--pb,48px));z-index:30;overflow:hidden}
.brand{height:68px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
.brand img{width:36px;height:36px;border-radius:50%;box-shadow:0 1px 4px rgba(19,32,51,.22);flex:none}
.brand .bt{display:none;min-width:0}
.brand .bt b{display:block;font-size:14px;white-space:nowrap}.brand .bt span{display:block;font-size:11px;color:var(--mut);line-height:1.3}
.app.open .brand .bt{display:block}
.side nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 6px;scrollbar-width:thin}
.side h6{display:none;margin:14px 16px 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:700;white-space:nowrap;text-transform:uppercase}
.side h6:first-child{margin-top:4px}
.app.open .side h6{display:block}
.nav{display:flex;align-items:center;gap:14px;height:41px;padding:0 0 0 26px;border-radius:10px;color:var(--ink2);cursor:pointer;margin-bottom:1px;white-space:nowrap;font-size:13px;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav svg.i{width:20px;height:20px}
.nav span{display:none}.app.open .nav span{display:inline}
.nav small{display:none;margin-left:auto;margin-right:10px;font-size:10px;font-weight:700;color:var(--mut);background:var(--neu);border-radius:5px;padding:1px 6px}
.app.open .nav small{display:inline}
.nav:hover{background:#EEF3F9}.nav.on{background:var(--pri-50);color:var(--pri);font-weight:700}
.me{margin:8px 6px 6px;border:1px solid var(--line);border-radius:12px;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;flex:none;width:calc(100% - 12px)}
.me:hover{border-color:var(--lineS)}
.app.open .me{justify-content:flex-start;padding:0 10px}
.me .mt{display:none;min-width:0;flex:1;text-align:left}.app.open .me .mt{display:block}
.me .mt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me .mt span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .chev{display:none;color:var(--mut)}.app.open .me .chev{display:block}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri-50);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:12px;flex:none;position:relative}
.av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#2DA66E;border:2px solid #fff}
.sfoot{display:none;padding:2px 18px 12px;font-size:10.5px;color:var(--mut);line-height:1.4}
.sfoot b{display:flex;gap:5px;align-items:center;color:var(--ink2);font-size:11px}.sfoot b svg{color:#2DA66E;width:14px;height:14px}
.app.open .sfoot{display:block}
#meMenu{position:fixed;left:12px;bottom:76px;width:270px;background:#fff;border:1px solid var(--cardb);border-radius:14px;box-shadow:0 12px 36px rgba(19,32,51,.18);padding:8px;z-index:60;max-height:70vh;overflow:auto}
#meMenu h6{margin:6px 8px 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase}
.mm{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px;border-radius:10px;text-align:left}
.mm:hover{background:var(--bg)}.mm.on{background:var(--pri-50)}
.mm b{display:block;font-size:12.5px}.mm small{display:block;font-size:11px;color:var(--mut)}
main{min-width:0}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 20px 0 22px;border-bottom:1px solid var(--line);background:var(--chrome);position:sticky;top:var(--pb,48px);z-index:20}
.tbi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);border:0;background:none;flex:none;position:relative}
.tbi:hover{background:#EEF3F9}.tbi.dim{color:var(--mut2)}
.tbi svg.i{width:20px;height:20px}
.crumb{margin-left:14px;color:var(--mut);white-space:nowrap;font-size:13px}.crumb b{color:var(--ink);font-weight:700}
.search{margin-left:auto;margin-right:10px;width:300px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;color:var(--mut);font-size:13px}
.kbd{margin-left:auto;background:var(--neu);color:var(--neuT);font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--chrome);line-height:1}
.conn{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;font-weight:600;margin-left:8px;white-space:nowrap}.conn svg{color:#2DA66E}
.wrap{padding:22px 24px 56px;min-width:0;max-width:1480px}

/* ===== page header (live Overview pattern) ===== */
.ph{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.ph-t{flex:1;min-width:0}
.eb{font-size:12px;font-weight:700;color:var(--mut)}
.ph h1{margin:2px 0 4px;font-size:28px;line-height:1.2;font-weight:700;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rchip{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-50);border:1px solid var(--pri-100);border-radius:6px;padding:2px 8px;letter-spacing:0;line-height:1.5}
.ph p{margin:0;color:var(--ink2);font-size:13px;max-width:760px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.meta .dotsep{width:3px;height:3px;border-radius:50%;background:var(--mut2)}
.ph-a{display:flex;gap:10px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}

/* ===== primitives ===== */
.card{background:var(--card);border:1px solid var(--cardb);border-radius:var(--r);min-width:0}
.stack{display:grid;gap:var(--gap);min-width:0;align-content:start}
.sp{flex:1}
.ch{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.ch .ci{color:var(--pri);flex:none;margin-top:1px;display:flex}
.ch .ci svg.i{width:21px;height:21px}
.cht{min-width:0;flex:1}
.ch h3{margin:0;font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3}
.ch p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.ch .ca{display:flex;gap:8px;align-items:center;flex:none;margin-left:auto}
.ti{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.ti svg.i{width:20px;height:20px}
.t-blue{background:#EAF1FB;color:var(--pri)}.t-green{background:#E9F6F0;color:var(--okI)}.t-vio{background:#F1EEFB;color:var(--vio)}.t-org{background:#FBF1E8;color:var(--org)}.t-red{background:#FCEDED;color:var(--bad)}.t-neu{background:var(--neu);color:var(--neuT)}.t-gold{background:#FFF5DF;color:var(--warn)}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;height:38px;font-weight:700;color:var(--ink2);white-space:nowrap;font-size:13px}
.btn svg.i{width:17px;height:17px}
.btn:hover{background:#F3F7FC;border-color:var(--lineS)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:999px;padding:0 18px}.btn.navy:hover{background:var(--navyH)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;border-radius:999px}.btn.pri:hover{background:var(--pri-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri);padding:0 8px}.btn.ghost:hover{background:var(--pri-50)}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;gap:6px}.btn.sm svg.i{width:15px;height:15px}
.btn.pri.sm{border-radius:999px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--neu);color:var(--neuT);vertical-align:middle}
.chip svg.i{width:12px;height:12px}
.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.warn{background:var(--warn-50);color:var(--warn)}.chip.bad{background:var(--bad-50);color:var(--bad)}.chip.pri{background:var(--pri-50);color:var(--pri)}.chip.vio{background:var(--vio-50);color:var(--vio)}
.muted{color:var(--mut)}.b{font-weight:700}
.note{display:flex;gap:10px;align-items:center;background:#FFF8EA;border:1px solid #F6E2B8;border-left:3px solid #E0A33A;border-radius:8px;padding:10px 14px;color:var(--ink2);font-size:12.5px;margin-bottom:var(--gap)}
.note>svg.i{color:var(--warn)}

/* KPI tiles — live Overview tile + caption */
.kgrid{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--kc,5),minmax(0,1fr));margin-bottom:var(--gap)}
.fullw{margin-bottom:var(--gap)}
.fullw td:first-child{min-width:240px}
.kt{background:#fff;border:1px solid var(--cardb);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:122px;text-align:left;min-width:0}
.kt:hover{border-color:var(--lineS);box-shadow:0 2px 10px rgba(19,32,51,.06)}
.kt.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.kh{display:flex;gap:10px;align-items:center;min-height:34px}
.kt .ti{width:34px;height:34px;border-radius:9px}.kt .ti svg.i{width:18px;height:18px}
.kl{font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.3}
.kv{font-size:26px;font-weight:700;color:var(--ink);line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv.money{font-size:19px;margin-top:12px}
.kv small{font-size:14px;color:var(--mut);font-weight:600}
.kv.bad{color:var(--bad)}.kv.warn{color:var(--warn)}.kv.ok{color:var(--ok)}
.ks{font-size:12px;color:var(--mut);line-height:1.35}

/* two-column body */
.cols{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.full{margin-top:var(--gap)}

/* work queue */
.qtabs{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.qt{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.qt b{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.qt:hover{border-color:var(--lineS)}
.qt.on{background:var(--pri-50);border-color:var(--pri-100);color:var(--pri)}.qt.on b{color:var(--pri)}
.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) 64px auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.qrow:hover{background:#F8FBFF}
.qrow .ti{width:40px;height:40px;border-radius:10px}.qrow .ti svg.i{width:19px;height:19px}
.qb{min-width:0}
.q1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.q1 b{font-size:13.5px;color:var(--ink)}
.qref{font-size:11.5px;font-weight:700;color:var(--pri);white-space:nowrap}
.qm{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qby{font-size:11.5px;color:var(--mut);margin-top:2px}
.qq{font-size:12px;color:var(--ink2);margin-top:4px;background:var(--bg);border-left:3px solid var(--org);border-radius:4px;padding:5px 9px;font-style:italic}
.age{text-align:right;line-height:1.2}
.age b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.age span{font-size:10.5px;color:var(--mut)}
.age.warn b{color:var(--warn)}.age.bad b{color:var(--bad)}
.qmore{width:100%;border:0;border-top:1px solid var(--line2);background:#FAFCFE;height:40px;font-weight:700;color:var(--pri);font-size:12.5px}
.qmore:hover{background:var(--pri-50)}
.qfoot{padding:10px 18px 12px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.qfoot svg.i{width:14px;height:14px;margin-top:1px;flex:none}
.clear{display:flex;gap:14px;align-items:center;padding:18px;border-top:1px solid var(--line2)}
.clear b{display:block;font-size:14px}.clear span{font-size:12.5px;color:var(--ink2)}

/* lists */
.li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line2);cursor:pointer}
.li:hover{background:#F8FBFF}
.li .ti{width:36px;height:36px;border-radius:10px}.li .ti svg.i{width:17px;height:17px}
.lt{font-weight:700;font-size:13px;color:var(--ink)}
.ld{font-size:12px;color:var(--ink2);margin-top:1px}
.lr{text-align:right;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.lr small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.lr.bad{color:var(--bad)}.lr.warn{color:var(--warn)}.lr.ok{color:var(--ok)}.lr.vio{color:var(--vio)}
.cbody{padding:0 0 6px}

/* stage bars */
.pv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 48px;gap:12px;align-items:center;padding:7px 18px;cursor:pointer}
.pv:hover{background:#F8FBFF}
.pl{font-size:12.5px;color:var(--ink2);font-weight:600;line-height:1.3}
.pl small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.pbw{height:10px;border-radius:6px;background:#E6ECF3;overflow:hidden}
.pbw i{display:block;height:100%;border-radius:6px}
.pn{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pfoot{padding:8px 18px 14px;font-size:11.5px;color:var(--mut)}

/* money */
.kvr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 18px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2)}
.kvr b{font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.kvr small{display:block;font-size:11px;color:var(--mut)}
.kvr b.bad{color:var(--bad)}.kvr b.ok{color:var(--ok)}.kvr b.vio{color:var(--vio)}.kvr b.pri{color:var(--pri)}
.mbar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:#E6ECF3;margin:4px 18px 8px}
.mbar i{display:block;height:100%}
.mleg{display:flex;gap:14px;flex-wrap:wrap;padding:0 18px 12px;font-size:11.5px;color:var(--ink2)}
.mleg span{display:inline-flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* bars */
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:end;height:170px;padding:8px 18px 14px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bc b{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bw{width:100%;max-width:44px;flex:1;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:3px}
.bc small{font-size:11px;color:var(--mut)}

/* request tracker */
.tr{padding:11px 18px;border-top:1px solid var(--line2);cursor:pointer}
.tr:hover{background:#F8FBFF}
.tr-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tr-h b{font-size:13px}
.tr-h .age{margin-left:auto}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 6px}
.steps i{height:6px;border-radius:4px;background:#E3E9F1;display:block}
.steps i.d{background:#9DBDEB}.steps i.c{background:var(--pri)}
.steps.warn i.c{background:var(--org)}
.tr-s{font-size:12px;color:var(--ink2)}
.tr-s b{color:var(--ink)}
.tr-s .warn{color:var(--warn);font-weight:700}.tr-s .bad{color:var(--bad);font-weight:700}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 18px 16px}
.tool{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:left;min-height:56px}
.tool:hover{border-color:var(--lineS);background:#F8FBFF}
.tool .ti{width:36px;height:36px;border-radius:10px}
.tool b{display:block;font-size:12.5px}.tool small{display:block;font-size:11px;color:var(--mut)}

/* tables */
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#F7F9FC;color:var(--mut);font-weight:700;font-size:10.5px;text-align:left;padding:9px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{padding-left:18px}th:last-child,td:last-child{padding-right:18px}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;height:48px}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FBFF}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{background:#F7F9FC;font-weight:700;border-top:1px solid var(--line);height:42px}
.cell-t b{display:block;font-size:12.5px;color:var(--ink)}.cell-t span{display:block;font-size:11.5px;color:var(--mut)}
.z{color:var(--mut2)}
.bad-t{color:var(--bad);font-weight:700}.warn-t{color:var(--warn);font-weight:700}.ok-t{color:var(--ok);font-weight:700}

/* role notes */
.rn{margin-bottom:var(--gap);border-color:#DCD3F7;background:linear-gradient(180deg,#FBFAFF 0,#fff 60%)}
.rn-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 8px}
.rn-h .ti{width:38px;height:38px;border-radius:10px}
.rn-h h3{margin:0;font-size:15px}
.rn-h p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.rn-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:4px 18px 10px}
.rn-g h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--vio)}
.rn-g ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.rn-g li{margin:2px 0}
.rn-f{border-top:1px solid #ECE7FA;padding:10px 18px 12px;font-size:12.5px;color:var(--ink2);display:grid;gap:4px}
.rn-f b{color:var(--ink)}
.src{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;border:1px dashed currentColor}
.src.live{color:var(--ok)}.src.part{color:var(--warn)}.src.new{color:var(--vio)}

/* skeleton */
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,#E9EEF4 0,#F4F7FA 50%,#E9EEF4 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skrow{display:grid;grid-template-columns:40px 1fr 70px;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line2)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(19,32,51,.3);opacity:0;pointer-events:none;transition:all .18s;z-index:100;max-width:min(560px,92vw)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== phone ===== */
.pwrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px 48px}
.phone{width:390px;height:844px;flex:none;border-radius:46px;background:#fff;border:10px solid #172235;box-shadow:0 24px 60px rgba(19,32,51,.28);overflow:hidden;display:flex;flex-direction:column;position:sticky;top:64px}
.phone.bare{width:100%;height:calc(100vh - var(--pb,48px));border:0;border-radius:0;box-shadow:none;position:relative;top:0}
.m-status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:700;background:#fff}
.phone.bare .m-status{display:none}
.m-head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);background:#fff}
.m-head img{width:30px;height:30px;border-radius:50%}
.m-head b{font-size:17px;flex:1}
.m-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);position:relative}
.m-ic .badge{top:6px;right:6px;border-color:#fff}
.m-body{flex:1;overflow:auto;background:var(--mbg);padding:14px 12px 24px;display:grid;gap:12px;align-content:start}
.m-hi{padding:2px 4px 0}
.m-hi .eb{font-size:12px}
.m-hi h2{margin:2px 0 2px;font-size:20px;line-height:1.25}
.m-hi p{margin:0;font-size:12.5px;color:var(--ink2)}
.m-hi .meta{margin-top:6px}
.m-act{display:grid;gap:8px}
.m-act .btn{height:48px;border-radius:14px;font-size:14px}
.m-act .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-act .row2 .btn{height:44px;font-size:12.5px;padding:0 8px}
.m-k{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-k .kt{min-height:104px;padding:12px;border-radius:14px}
.m-k .kv{font-size:22px;margin-top:4px}.m-k .kv.money{font-size:15px;margin-top:8px}
.m-k .kl{font-size:12px}
.m-body .card{border-radius:16px}
.m-body .ch{padding:14px 14px 8px}
.m-body .ch h3{font-size:15px}
.m-body .qtabs{padding:0 14px 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.m-body .qt{height:36px;flex:none}
.m-body .qrow{grid-template-columns:38px minmax(0,1fr) auto;gap:10px;padding:12px 14px}
.m-body .qrow .age{grid-column:3;grid-row:1}
.m-body .qrow .btn{grid-column:2/4;justify-self:start;height:40px;min-width:120px}
.m-body .li{grid-template-columns:36px minmax(0,1fr) auto;padding:11px 14px}
.m-body .pv{padding:7px 14px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 40px}
.m-body .kvr{padding:8px 14px}
.m-body .tr{padding:12px 14px}
.m-body .tools{padding:0 14px 14px;grid-template-columns:1fr 1fr}
.m-body .qfoot{padding:10px 14px 12px}
.m-body .rn-g{grid-template-columns:1fr;padding:4px 14px 10px}.m-body .rn-h{padding:14px 14px 6px}.m-body .rn-f{padding:10px 14px 12px}.m-body .rn{margin:0}
.m-body .mbar{margin:4px 14px 8px}.m-body .mleg{padding:0 14px 12px}
.mcard{padding:11px 14px;border-top:1px solid var(--line2);cursor:pointer}
.mcard:hover{background:#F8FBFF}
.mc-t{font-size:13px}
.mc-g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:6px}
.mc-g div{min-width:0}
.mc-g span{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.mc-g b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.m-nav{height:76px;flex:none;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px 14px}
.phone.bare .m-nav{position:sticky;bottom:0;padding-bottom:8px;height:64px}
.mn{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);border-radius:12px;position:relative}
.mn svg.i{width:22px;height:22px}
.mn.on{color:var(--pri)}
.mn.on .mni{background:var(--pri-50)}
.mni{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.mn .badge{top:-2px;right:6px;border-color:#fff}
.pnotes{width:420px;flex:none;position:sticky;top:64px}
.pnotes .rn-g{grid-template-columns:1fr}

/* ===== responsive ===== */
@media (max-width:900px){.kgrid{--kc:2!important}}
@media (max-width:1180px){.cols{grid-template-columns:1fr}.rn-g{grid-template-columns:1fr 1fr}.pnotes{display:none}}
@media (max-width:1050px){
  .app,.app.open{grid-template-columns:1fr}.side{display:none}
  .app.open .side{display:flex;position:fixed;left:0;top:var(--pb,48px);width:246px;box-shadow:0 0 40px rgba(19,32,51,.25)}
  .search,.crumb{display:none}.conn{margin-left:auto}
}
@media (max-width:900px){.pb-roles{display:none}.pb-sel{display:block}}
@media (max-width:720px){.seg.dev button span{display:none}.seg button{padding:0 8px}}


/* ===== workforce additions ===== */
.ro{display:inline-flex;gap:5px;align-items:center;height:22px;padding:0 9px;border-radius:6px;background:var(--neu);color:var(--neuT);font-size:11px;font-weight:700}
.ro svg.i{width:13px;height:13px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.m-body .dstrip{min-height:72px}.m-body .wlist{max-height:none;overflow:visible}
.dchip{flex:none;min-width:62px;height:62px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink2);position:relative}
.dchip b{font-size:16px;color:var(--ink)}
.dchip.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:var(--pri-50)}
.dchip.off{background:#F7F9FC}
.dchip.future{opacity:.45;pointer-events:none}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-confirmed{background:var(--ok)}.s-submitted{background:var(--pri)}.s-returned{background:var(--org)}.s-draft{background:var(--mut2)}.s-none{background:transparent;border:1.5px solid var(--bad)}.s-off{background:#D5DCE5}
.dayhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dayhead h2{margin:0;font-size:20px}
.tools2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wcard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
.wcard.miss{background:#FFF8EA}
.wav{width:40px;height:40px;border-radius:50%;background:var(--pri-50);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.wn{font-weight:700;font-size:14px;color:var(--ink);border:0;background:none;padding:0;text-align:left}
.wm{font-size:12px;color:var(--mut)}
.wt{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:4px}
.pill{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink2);padding:0 8px}
.pill.on.P{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.on.A{background:var(--bad);border-color:var(--bad);color:#fff}
.pill.on.L{background:var(--vio);border-color:var(--vio);color:#fff}
.pill.on.OFF{background:#5B6B80;border-color:#5B6B80;color:#fff}
.otb{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--warn-50);color:var(--warn)}
.otb.hol{background:var(--vio-50);color:var(--vio)}
.footbar{position:sticky;bottom:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#fff;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.footbar .sum{flex:1;min-width:180px;font-size:12.5px;color:var(--ink2)}
.footbar .sum b{color:var(--ink)}
.lockbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line2);background:#F7FAFD;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.lockbar b{color:var(--ink)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;font-size:12.5px;color:var(--ink2);background:#F1F6FE;border:1px solid #DCE8FB;margin:0 16px 10px}
.banner.vio{background:#F6F3FF;border-color:#E3DBFA}.banner.warn{background:#FFF8EA;border-color:#F6E2B8}.banner.bad{background:#FFF4F4;border-color:#F6D3D3}
.banner svg.i{flex:none;margin-top:1px}
/* desktop grid entry */
.grid-in td{height:52px;padding:6px 8px}
.grid-in input.t,.grid-in input.p,.grid-in select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;width:100%;min-width:0;background:#fff;font-size:13px}
.grid-in input.t{width:92px;text-align:center;font-variant-numeric:tabular-nums}
.grid-in input.p{min-width:150px}
.grid-in input:focus,.grid-in select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.grid-in input.bad{border-color:var(--bad);background:var(--bad-50)}
.grid-in tr.copied td{background:#FBFCFE}
.grid-in select{width:118px}
.grid-in td:first-child{min-width:170px}
.hint{font-size:10.5px;color:var(--mut);text-align:center;margin-top:2px;height:12px}
/* editor sheet */
.scrim{position:fixed;inset:0;background:rgba(19,32,51,.38);z-index:95;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(19,32,51,.25);padding:6px 0 0}
.scrim.center .sheet{border-radius:18px}
.grab{width:42px;height:5px;border-radius:3px;background:#D5DCE5;margin:6px auto 4px}
.sh{display:flex;gap:12px;align-items:center;padding:8px 18px 12px;border-bottom:1px solid var(--line2)}
.sh h3{margin:0;font-size:17px}
.sb{padding:14px 18px;display:grid;gap:14px}
.lbl{font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.segw{display:flex;gap:6px;flex-wrap:wrap}
.segw button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--ink2)}
.segw button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tf input{width:100%;height:48px;border:1px solid var(--lineS);border-radius:12px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tf input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-100)}
.tf input.bad{border-color:var(--bad);background:var(--bad-50)}
.tf span{display:block;font-size:11px;color:var(--mut);text-align:center;margin-top:3px;min-height:14px}
.tf small{display:block;font-size:10.5px;color:var(--mut);text-align:center;margin-bottom:4px;font-weight:700;text-transform:uppercase}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qc{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.qc:hover,.qc.on{border-color:var(--pri);color:var(--pri);background:var(--pri-50)}
.calcbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg);border-radius:12px;padding:10px}
.calcbox div{text-align:center}.calcbox b{display:block;font-size:17px}.calcbox span{font-size:11px;color:var(--mut)}
.fin{width:100%;height:46px;border:1px solid var(--lineS);border-radius:12px;padding:0 12px;font-size:14px}
.fin:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-100)}
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--cardb);border-radius:12px;box-shadow:0 12px 30px rgba(19,32,51,.16);z-index:90;overflow:hidden;max-height:280px;overflow-y:auto}
.sug button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 12px;min-height:44px;border-top:1px solid var(--line2)}
.sug button:first-child{border-top:0}
.sug button:hover,.sug button.hi{background:var(--pri-50)}
.sug b{font-size:13px}.sug small{display:block;font-size:11.5px;color:var(--mut)}
.sug .dym{font-size:11.5px;color:var(--warn);font-weight:700;padding:8px 12px;background:#FFF8EA}
.sf{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff}
.sf .btn{height:46px;flex:1;border-radius:12px}
/* paper monthly sheet */
.paper{background:#fff;border:1px solid var(--cardb);border-radius:var(--r);padding:18px 18px 10px}
.paper h2{text-align:center;margin:0 0 12px;font-size:17px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:5px}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:12.5px;margin-bottom:12px}
.ph2 span{color:var(--mut)}.ph2 b{color:var(--ink)}
.pt{border-collapse:collapse;width:100%;font-size:12px}
.pt th{background:#F7F9FC;border:1px solid #D3DCE7;padding:6px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);text-align:center}
.pt td{border:1px solid #E1E7EF;padding:5px 6px;height:30px;text-align:center;font-variant-numeric:tabular-nums}
.pt td.l{text-align:left}
.pt tr.sun td{background:#FFFBE0}
.pt tr.sig td{background:#F4F8FD;text-align:left;font-size:11.5px;color:var(--ink2);height:28px}
.pt tr.tot td{background:#F7F9FC;font-weight:700}
.st-c{color:var(--ok);font-weight:700}.st-s{color:var(--pri);font-weight:700}.st-r{color:var(--org);font-weight:700}.st-n{color:var(--mut2)}
.wlist{max-height:620px;overflow:auto}
.wli{display:flex;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line2);background:none;padding:10px 14px;text-align:left;min-height:52px}
.wli:hover{background:#F8FBFF}.wli.on{background:var(--pri-50)}
.wli .wav{width:34px;height:34px;font-size:12px}
.wli b{display:block;font-size:13px}.wli small{display:block;font-size:11.5px;color:var(--mut)}
.mday{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line2)}
.mday.sun{background:#FFFBE0}
.mday .dd b{display:block;font-size:15px}.mday .dd small{font-size:11px;color:var(--mut)}
.strip7{display:flex;gap:4px}
.strip7 i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.strip7 i.s-none{color:var(--bad)}.strip7 i.s-off{color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);padding:0 18px 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.flag{display:inline-flex;gap:4px;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--warn-50);color:var(--warn)}
.flag.vio{background:var(--vio-50);color:var(--vio)}.flag.bad{background:var(--bad-50);color:var(--bad)}.flag.ok{background:var(--ok-50);color:var(--ok)}
textarea.fin{height:80px;padding:10px 12px;resize:vertical}
.rcard{padding:14px 18px;border-top:1px solid var(--line2);display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center}
.rcard .ti{width:42px;height:42px}
.rflags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
tr.flagged td{background:#FFFBF2}
.m-body .footbar{position:sticky;bottom:-24px;margin:0 -12px -24px;border-radius:0;padding:12px 14px 14px}
.m-body .banner{margin:0 14px 10px}
@media print{
  #pbar,.side,.topbar,.noprint,.m-nav,.m-head,.m-status{display:none!important}
  .app{display:block}.wrap{padding:0}.paper{border:0}.cols2>:first-child{display:none}.cols2{display:block}
  body{background:#fff}
}
.cols2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:1180px){.cols2{grid-template-columns:1fr}.wlist{max-height:260px}}
.s-entered{background:var(--ok)}.s-query{background:var(--org)}.s-locked{background:var(--navy)}
.strip7 i.s-draft{color:#fff}.strip7 i{cursor:default}
</style>

function parseT(str,after){
  let s=String(str||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!s)return {v:null,ok:true};
  let ap=null;
  if(/p\.?m?\.?$/.test(s)){ap='p';s=s.replace(/p\.?m?\.?$/,'')}else if(/a\.?m?\.?$/.test(s)){ap='a';s=s.replace(/a\.?m?\.?$/,'')}
  s=s.replace(/[.\-h;]/g,':');
  let h,m=0;
  if(/^\d{1,2}:\d{1,2}$/.test(s)){[h,m]=s.split(':').map(Number)}
  else if(/^\d{3,4}$/.test(s)){h=+s.slice(0,-2);m=+s.slice(-2)}
  else if(/^\d{1,2}$/.test(s)){h=+s}
  else return {v:null,ok:false};
  if(m>59||h>23)return {v:null,ok:false};
  if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0;
  let v=h*60+m;
  if(!ap&&h<12&&after!=null&&v<=after&&v+720>after)v+=720;
  return {v,ok:true};
}
function calc(r,date){
  const z={w:0,reg:0,nor:0,hol:0,miss:false};
  if(!r||r.st!=='P')return z;

  let w=r.fin-r.start;
  for(const [a,b] of (r.brk||[]))if(a!=null&&b!=null&&b>a)w-=b-a;
  w=Math.max(0,w);

}

const canon=s=>String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g,' ')
  .replace(/\b(mohammed|mohammad|mohamed|mohamad|muhamad|mohd|md|muhammed)\b/g,'muhammad')
  .replace(/ul+ah?\b/g,'ullah').replace(/\b(sweihan|swehan|suwaihan|swihan)\b/g,'sweihan').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function fuzzy(q,items,key){
  const cq=canon(q);if(!cq)return [];
  const flat=cq.replace(/ /g,'');
  return items.map(it=>{
    const cn=canon(key(it)),cf=cn.replace(/ /g,'');
    let sc;
    if(cf.startsWith(flat)||cn.split(' ').some(w=>w.startsWith(cq)))sc=0;
    else if(cf.includes(flat))sc=1;
    else{const words=[cf,...cn.split(' ')];sc=2+Math.min(...words.map(w=>lev(flat,w.slice(0,Math.max(flat.length,1)))));if(sc>2+Math.max(1,Math.floor(flat.length/4)))sc=99}
    return {it,sc};
  }).filter(x=>x.sc<99).sort((a,b)=>a.sc-b.sc).slice(0,6);
}

/* =====================================================================
   NOTES — research and design decisions
   ===================================================================== */
function notes(){
  return `<section class="card rn"><div class="rn-h"><span class="ti t-vio">${ic('book')}</span><div class="cht"><h3>How this replaces the paper sheet</h3><p>Whoever is assigned to a crew enters its attendance, today or any earlier day. Reviewers watch as it happens and confirm the month once.</p></div><button class="btn ghost sm" data-act="notes">Hide notes</button></div>
  <div class="rn-g"><div><h5>Borrowed from real apps</h5><ul><li>The attendance taker enters the whole crew at once (Procore “bulk time entry”, Lumber “foreman mode”)</li><li>Copy the previous day, then change only what differs (Procore, ServiceTitan)</li><li>Overtime worked out automatically, split into normal and holiday</li><li>A manager sign-off at the end of the period, with a reminder</li></ul></div>
  <div><h5>Faster than paper</h5><ul><li>Catch up missed days: every earlier day of the month is one tap back</li><li>Type “5” for 5 PM or “630” for 6:30 AM</li><li>Names and projects forgive spelling: “oheed”, “mohd”, “swehan 321”</li><li>Sunday starts as a rest day, but anyone who came is one tap away</li></ul></div>
  <div><h5>How review works</h5><ul><li>No daily approval. Every entry is visible to the reviewer straight away</li><li>The reviewer can change a day (with a reason) or ask the taker a question</li><li>On 30 Nov the reviewer is notified to confirm the month; then it locks</li><li>Workshop attendance needs no confirmation</li></ul></div></div>
  <div class="rn-f"><div><b>PR</b> is shown as its own role, which Yorks will add. It can view the Workforce Overview, Monthly sheets, Projects and Rental Properties, without changing anything. <b>Accountant</b> needs Workforce view access granted.</div><div><b>Demo:</b> use “30 Nov” in the top bar to see the month-end notification and confirmation. Sweihan has two days left blank on purpose.</div></div></section>`;
}

/* =====================================================================
   SECTION: Workforce Overview — central view of every crew (read only for PR / Accountant)
   ===================================================================== */
function monthTotals(crews){
  let nor=0,hol=0,reg=0;
  for(const x of Object.values(DB.days)){if(!crews.includes(x.crew)||!x.saved)continue;for(const r of Object.values(x.rows)){const c=calc(r,x.date);nor+=c.nor;hol+=c.hol;reg+=c.reg}}
  return {nor,hol,reg};
}
const SYM={entered:'✓',query:'?',draft:'…',none:'!',off:'—',locked:'✓',future:''};
function stripDays(c,days){return `<span class="strip7">${days.map(d=>{const s=dayStatus(c,d);return `<i class="s-${s}" title="${dshort(d)} · ${STC[s][0]}">${SYM[s]}</i>`}).join('')}</span>`}
const week=()=>{const i=NOV.indexOf(TODAY);return NOV.slice(Math.max(0,i-7),i+1)};
function monthState(c){const cr=CREWS[c];if(!cr.review)return ['No confirmation needed','ok'];if(monthDone(c))return [`Confirmed by ${DB.months[c].by.split(' ')[0]}`,'pri'];return TODAY>='2026-11-30'?['Ready to confirm','warn']:['Recording · confirm on 30 Nov','neu']}
function vOverview(phone){
  const r=R(),crews=r.crews;
  const entered=crews.filter(c=>['entered','query','locked'].includes(dayStatus(c,TODAY))).length;
  const miss=crews.flatMap(c=>missingDays(c).map(d=>[c,d]));
  const t=monthTotals(crews);
  const rv=crews.filter(c=>CREWS[c].review);
  const conf=rv.filter(monthDone).length;
  const kp=[
   ['check','t-blue',`Today · ${dshort(TODAY)}`,`${entered} <small>of ${crews.length} crews</small>`,entered<crews.length?`${crews.length-entered} not entered yet`:'All crews entered'],
   ['alert',miss.length?'t-red':'t-green','Earlier days not entered',String(miss.length),miss.length?miss.slice(0,2).map(([c,d])=>`${CREWS[c].name.split(' ')[0]} ${dshort(d)}`).join(' · '):'Nothing missing'],
   ['clock','t-org','Overtime this month',`${hhz(t.nor)} <small>h normal</small>`,`${hhz(t.hol)} h holiday`],
   ['shield','t-vio','November confirmation',rv.length?`${conf} <small>of ${rv.length} crews</small>`:'—',TODAY>='2026-11-30'?'Reviewers notified today':'Reviewers are notified on 30 Nov'],
  ];
  const kh=kp.map(([i,tn,l,v,s])=>`<div class="kt" style="cursor:default"><div class="kh"><span class="ti ${tn}">${ic(i)}</span><span class="kl">${l}</span></div><div class="kv">${v}</div><div class="ks">${s}</div></div>`).join('');
  const rows=crews.map(c=>{const cr=CREWS[c];const ms=monthState(c);const done=workDaysSoFar().filter(d=>['entered','query','locked'].includes(dayStatus(c,d))).length;const tt=monthTotals([c]);
    return phone?`<div class="mcard" data-crew="${c}"><div class="mc-t"><b>${cr.name}</b> <span class="muted">· ${cr.project}</span></div><div style="margin:6px 0">${stripDays(c,week())}</div><div class="mc-g"><div><span>Entered by</span><b>${cr.takers.join(', ')}</b></div><div><span>Days entered</span><b>${done} of ${workDaysSoFar().length}</b></div><div><span>Overtime</span><b>${hhz(tt.nor)} h · HOL ${hhz(tt.hol)} h</b></div><div><span>Month</span><b class="${ms[1]==='warn'?'warn-t':''}">${ms[0]}</b></div></div></div>`
    :`<tr class="click" data-crew="${c}"><td><div class="cell-t"><b>${cr.name}</b><span>${cr.project} · ${members(c).length} workers</span></div></td><td>${cr.takers.map(n=>`<div>${n}</div>`).join('')}</td><td>${stripDays(c,week())}</td><td class="n">${done} / ${workDaysSoFar().length}</td><td class="n">${hhz(tt.nor)}</td><td class="n">${hhz(tt.hol)}</td><td><span class="chip ${ms[1]}">${ms[0]}</span></td></tr>`}).join('');
  const feed=DB.feed.filter(f=>crews.includes(f.crew)).slice(0,7);
  const feedH=feed.map(f=>`<div class="li" data-open="${f.crew}|${f.date}"><span class="ti ${f.kind==='entered'?'t-green':f.kind==='asked'?'t-org':'t-vio'}">${ic(f.kind==='entered'?'check':f.kind==='asked'?'chat':'edit')}</span><div><div class="lt">${f.by} ${f.kind==='entered'?'entered':f.kind==='asked'?'asked about':f.kind==='answered'?'answered on':'changed'} ${CREWS[f.crew].name} · ${dshort(f.date)}</div><div class="ld">${f.what?esc(f.what):dayLine(day(f.crew,f.date))}</div></div><div class="lr">${dshort(f.t.slice(0,10)).slice(4)}<small>${f.t.slice(11)}</small></div></div>`).join('');
  const legend=`<div class="legend">${[['entered','✓ Entered'],['query','? Question open'],['draft','… Started'],['none','! Not entered'],['off','— Rest day']].map(([s,l])=>`<span><i class="sdot s-${s}"></i>${l}</span>`).join('')}</div>`;
  const head=`<div class="ph"><div class="ph-t"><div class="eb">${r.name}</div><h1>Workforce Overview <span class="rchip">${r.role}</span>${r.ro?` <span class="ro">${ic('eye')}Read only</span>`:''}</h1><p>${r.ro?'Every crew’s attendance as it is entered. Months confirmed by the reviewer are final; until then figures can still change.':'Your crews this month. Select a crew to open its days.'}</p><div class="meta"><span>${dow(TODAY)} ${dnum(TODAY)} November 2026</span></div></div>${!phone&&r.take?`<div class="ph-a"><button class="btn navy" data-nav="take">${ic('check')}Take attendance</button></div>`:''}</div>`;
  if(phone)return `${head}<div class="m-k">${kh}</div><section class="card">${cardH('users','Crews',`Last 8 days`)}${legend}${rows}</section><section class="card">${cardH('history','What’s happening')}${feedH}</section>`;
  return `${head}<div class="kgrid" style="--kc:4">${kh}</div><div class="cols"><section class="card">${cardH('users','Crews','Last 8 days. Hours are this month’s overtime.')}${legend}<div class="tw"><table><thead><tr><th>Crew</th><th>Entered by</th><th>Last 8 days</th><th class="n">Days entered</th><th class="n">OT normal h</th><th class="n">OT holiday h</th><th>November</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="card">${cardH('history','What’s happening','Every entry, change and question, newest first.')}<div class="cbody">${feedH}</div></section></div>`;
}
const cardH=(i,t,s='',a='')=>`<div class="ch"><span class="ci">${ic(i)}</span><div class="cht"><h3>${t}</h3>${s?`<p>${s}</p>`:''}</div>${a?`<div class="ca">${a}</div>`:''}</div>`;
function dayLine(x){if(!x)return '';const t=dayTotals(x);return `${t.p} present · ${t.a} absent · ${t.l} leave · OT ${hhz(t.nor)} h${t.hol?` · HOL ${hh(t.hol)} h`:''}`}

/* =====================================================================
   SECTION: Attendance capture — the assigned taker enters today or any earlier day
   ===================================================================== */
function ensureDay(c,d){
  const k=c+'|'+d;
  if(!DB.days[k]){const rows={};for(const w of members(c))rows[w.id]={st:dayType(d)==='work'?null:'OFF'};DB.days[k]={crew:c,date:d,saved:false,rows,changes:[]};}
  return DB.days[k];
}
/* Taker edits freely until the month is confirmed. A reviewer who is not the taker unlocks a saved day with a reason. */
function editable(x){if(R().ro||monthDone(x.crew)||d0(x.date))return false;if(isTaker(x.crew)&&(!x.saved||x.by===R().name||!isReviewer(x.crew)))return true;return !!S.unlock[x.crew+'|'+x.date];}
const d0=d=>d>TODAY;
function prevDay(c,d){for(let i=NOV.indexOf(d)-1;i>=0;i--){const x=day(c,NOV[i]);if(x&&x.saved&&dayType(NOV[i])===dayType(d))return x;}return null}
function rowSummary(r,d){
  if(!r||!r.st)return `<span class="muted">Not marked</span>`;
  if(r.st!=='P')return `<b>${STLBL(r.st)}</b>`;
  const c=calc(r,d);
  if(c.miss)return `<span class="bad-t">Time missing</span>`;
  const br=(r.brk||[]).filter(b=>b[0]!=null).map(b=>`break ${tm(b[0])}–${tm(b[1])}`).join(', ');
  return `<span>${tm(r.start)} – ${tm(r.fin)}</span>${br?`<span class="muted">· ${br}</span>`:''}${c.nor?`<span class="otb">OT ${hh(c.nor)} h</span>`:''}${c.hol?`<span class="otb hol">HOL ${hh(c.hol)} h</span>`:''}`;
}
function dayTotals(x){let p=0,a=0,l=0,n=0,nor=0,hol=0,miss=0;for(const r of Object.values(x.rows)){if(!r.st)n++;else if(r.st==='P'){p++;const c=calc(r,x.date);nor+=c.nor;hol+=c.hol;if(c.miss)miss++}else if(r.st==='A')a++;else if(r.st!=='OFF')l++}return {p,a,l,n,nor,hol,miss}}
function logChange(x,wid,what){if(!x.saved||x.by===R().name&&!S.unlock[x.crew+'|'+x.date])return;const why=S.unlock[x.crew+'|'+x.date]||'Edited after entry';x.changes.push({by:R().name,at:now(),wid,what,why});DB.feed.unshift({t:now(),crew:x.crew,date:x.date,by:R().name,kind:'changed',what:`${WK[wid].name}: ${what}`});
  if(x.by!==R().name)DB.notes.unshift({to:x.by,t:now(),msg:`${R().name} changed ${WK[wid].name} on ${dshort(x.date)}: ${what} — “${why}”`,go:{crew:x.crew,date:x.date}});}
function rowWhat(r){return r.st==='P'?`${tm(r.start)}–${tm(r.fin)}`:STLBL(r.st)}
function vTake(phone){
  const r=R();
  const c=S.crew,cr=CREWS[c],d=S.date;
  const x=ensureDay(c,d);const ed=editable(x);
  const miss=missingDays(c);
  const strip=`<div class="dstrip">${NOV.map(dd=>{const s=dayStatus(c,dd);return `<button class="dchip ${dd===d?'on':''} ${dayType(dd)!=='work'?'off':''} ${dd>TODAY?'future':''}" data-date="${dd}" aria-label="${dshort(dd)} · ${STC[s][0]}"><span>${dow(dd).slice(0,3)}</span><b>${dnum(dd)}</b><i class="sdot s-${s}"></i></button>`}).join('')}</div>`;
  const missBar=miss.filter(m=>m!==d).length?`<div class="tools2" style="margin:-2px 0 10px"><span class="muted" style="font-size:12px">Not entered yet:</span>${miss.filter(m=>m!==d).slice(0,6).map(m=>`<button class="qc" style="height:32px;border-color:#F0C9C9;color:var(--bad)" data-date="${m}">${dshort(m)}</button>`).join('')}</div>`:'';
  const crewSel=r.crews.length>1?`<select class="fin" style="max-width:260px;height:40px" data-sel="crew">${r.crews.map(k=>`<option value="${k}" ${k===c?'selected':''}>${CREWS[k].name}</option>`).join('')}</select>`:`<b>${cr.name}</b>`;
  const t=dayTotals(x);
  const st=STC[dayStatus(c,d)]||STC.draft;
  const dt=dayType(d);
  let banner='';
  if(dt!=='work')banner+=`<div class="banner vio">${ic('cal')}<div><b>${dow(d)} — ${dayLabel(d).toLowerCase()}.</b> Everyone starts as rest day. Mark anyone who came; their hours count as holiday overtime.</div></div>`;
  if(d<TODAY&&!x.saved)banner+=`<div class="banner">${ic('history')}<div>You are entering an earlier day. It will show as entered on ${dshort(TODAY)}.</div></div>`;
  if(x.query&&x.query.open)banner+=`<div class="banner warn">${ic('chat')}<div style="flex:1"><b>${x.query.by} asked:</b> “${esc(x.query.msg)}”${isTaker(c)&&!isReviewer(c)?`<div class="tools2" style="margin-top:8px"><input class="fin" style="height:38px;flex:1;min-width:160px" data-ans placeholder="Your answer"><button class="btn sm pri" data-act="answer">Send answer</button></div>`:''}</div></div>`;
  if(x.changes&&x.changes.length)banner+=`<div class="banner">${ic('edit')}<div>${x.changes.map(ch=>`<b>${ch.by}</b> changed ${WK[ch.wid].name}: ${esc(ch.what)} — “${esc(ch.why)}” · ${dshort(ch.at.slice(0,10))} ${ch.at.slice(11)}`).join('<br>')}</div></div>`;
  if(monthDone(c))banner+=`<div class="banner">${ic('shield')}<div><b>November is confirmed</b> by ${DB.months[c].by}. Days are locked.</div></div>`;
  const shift=cr.shift;
  const prev=prevDay(c,d);
  const toolbar=ed?`<div class="tools2" style="padding:0 16px 12px">
     ${prev?`<button class="btn sm" data-act="copy">${ic('copy')}Copy ${dshort(prev.date)}</button>`:''}
     ${dt==='work'?`<button class="btn sm" data-act="allp">${ic('check')}Everyone present</button>`:''}
     <button class="btn sm" data-act="shift">${ic('clock')}Shift ${tm(shift.start)} – ${tm(shift.fin)}</button>
     <div class="ac" style="flex:1;min-width:200px"><input class="fin" style="height:36px;font-size:13px" data-ac="worker" placeholder="Add a worker — type any part of the name" autocomplete="off"><div class="sug" id="sug-worker" hidden></div></div></div>`:'';
  const ids=Object.keys(x.rows);
  let list;
  if(phone||!ed){
    list=ids.map(id=>{const w=WK[id],rw=x.rows[id],cc=calc(rw,d);const pills=ed?`<div class="pills">${dt==='work'?'':`<button class="pill ${rw.st==='OFF'?'on OFF':''}" data-st="${id}:OFF" aria-label="Rest day">Off</button>`}<button class="pill ${rw.st==='P'?'on P':''}" data-st="${id}:P" aria-label="Present">P</button><button class="pill ${rw.st==='A'?'on A':''}" data-st="${id}:A" aria-label="Absent">A</button><button class="pill ${LEAVE[rw.st]?'on L':''}" data-ed="${id}" aria-label="Leave or more">${LEAVE[rw.st]?'L':'···'}</button></div>`:`<span class="chip ${rw.st==='P'?'ok':rw.st==='A'?'bad':''}">${STLBL(rw.st)}</span>`;
      const chg=(x.changes||[]).some(ch=>ch.wid===id);
      return `<div class="wcard ${cc.miss?'miss':''}"><span class="wav">${ini(w.name)}</span><div style="min-width:0"><button class="wn" ${ed?`data-ed="${id}"`:''}>${w.name}${w.crew!==c?` <span class="chip vio">From ${w.crew?CREWS[w.crew].name:'labour pool'}</span>`:''}${chg?' <span class="chip">Changed</span>':''}</button><div class="wm">${w.no} · ${w.trade}${rw.proj&&rw.proj!==cr.project&&rw.st==='P'?` · <b>${rw.proj}</b>`:''}</div><div class="wt">${rowSummary(rw,d)}</div></div>${pills}</div>`}).join('');
  }else{
    list=`<div class="tw"><table class="grid-in"><thead><tr><th>Worker</th><th>Status</th><th>In</th><th>Break</th><th>Back</th><th>Out</th><th class="n">Hours</th><th class="n">OT normal</th><th class="n">OT holiday</th><th>Project</th><th></th></tr></thead><tbody>${ids.map(id=>{const w=WK[id],rw=x.rows[id],cc=calc(rw,d),P=rw.st==='P';const b=(rw.brk||[])[0]||[null,null];
      const tin=(f,v,after)=>`<input class="t" data-t="${id}:${f}" value="${esc(tmIn(v))}" ${P?'':'disabled'} placeholder="${P?'–':''}" data-after="${after??''}" aria-label="${f}">`;
      return `<tr class="${rw.copied?'copied':''}"><td><div class="cell-t"><b>${w.name}</b><span>${w.no} · ${w.trade}</span></div></td>
       <td><select data-sel="st:${id}">${[['','Not marked'],['P','Present'],['A','Absent'],...(dt==='work'?[]:[['OFF','Rest day']]),...Object.entries(LEAVE)].map(([v,l])=>`<option value="${v}" ${rw.st===v||(!rw.st&&!v)?'selected':''}>${l}</option>`).join('')}</select></td>
       <td>${tin('start',rw.start)}</td><td>${tin('b0',b[0],rw.start)}</td><td>${tin('b1',b[1],b[0]??rw.start)}</td><td>${tin('fin',rw.fin,b[1]??rw.start)}</td>
       <td class="n">${cc.miss?'<span class="bad-t">?</span>':hh(cc.w)}</td><td class="n">${cc.nor?`<b class="warn-t">${hh(cc.nor)}</b>`:''}</td><td class="n">${cc.hol?`<b style="color:var(--vio)">${hh(cc.hol)}</b>`:''}</td>
       <td><input class="p" data-proj="${id}" list="projlist" value="${esc(P?rw.proj||cr.project:'')}" ${P?'':'disabled'}></td><td><button class="btn sm" data-ed="${id}" title="Open">${ic('edit')}</button></td></tr>`}).join('')}</tbody></table><datalist id="projlist">${PROJECTS.map(p=>`<option value="${p}">`).join('')}</datalist></div>`;
  }
  const sum=`<b>${t.p}</b> present · <b>${t.a}</b> absent · <b>${t.l}</b> leave${t.n?` · <b class="bad-t">${t.n} not marked</b>`:''}${t.miss?` · <b class="bad-t">${t.miss} time missing</b>`:''} · OT <b>${hhz(t.nor)}</b> h${t.hol?` · HOL <b>${hh(t.hol)}</b> h`:''}`;
  const ready=!t.n&&!t.miss;
  let foot;
  if(ed&&!x.saved)foot=`<div class="footbar"><div class="sum">${sum}<div class="muted" style="font-size:11px;margin-top:2px">Saved on this device as you go. ${cr.review?`${cr.reviewer} can see it once you save.`:'No confirmation needed.'}</div></div><button class="btn navy" data-act="saveday" ${ready?'':'disabled style="opacity:.5"'}>${ic('check')}Save ${dshort(d)}</button></div>`;

}

function flagsFor(c){

  return f;
}

  const v={overview:vOverview,take:vTake,review:vReview,sheets:vSheets,projects:vProjects,rentals:vRentals}[S.view](ph);
  document.getElementById('stage').innerHTML=ph?shellPhone(v,bareMode()):shellDesk(v);
  const on=document.querySelector('.dchip.on');if(on){const st=on.parentElement;st.scrollLeft=on.offsetLeft-st.clientWidth/2+on.offsetWidth/2;}
  if(keep){window.scrollTo(0,y);const nb=document.getElementById('mbody');if(nb)nb.scrollTop=my;}else window.scrollTo(0,0);
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800);}
const now=()=>TODAY+' '+new Date().toTimeString().slice(0,5);

function setStatus(id,st){const x=day(S.crew,S.date),r=x.rows[id],sh=CREWS[S.crew].shift;const before=JSON.parse(JSON.stringify(r));
  if(st==='P'){x.rows[id]={st:'P',start:r.start??sh.start,fin:r.fin??(dayType(S.date)==='work'?sh.fin:900),brk:r.brk??sh.brk.map(b=>[...b]),proj:r.proj||CREWS[S.crew].project,why:r.why}}
  else x.rows[id]={st};
  if(before.st!==x.rows[id].st)logChange(x,id,`${rowWhat(before)} → ${rowWhat(x.rows[id])}`);
  save();render(true);}
function setStatusQuiet(x,id){const sh=CREWS[x.crew].shift;x.rows[id]={st:'P',start:sh.start,fin:dayType(x.date)==='work'?sh.fin:900,brk:sh.brk.map(b=>[...b]),proj:CREWS[x.crew].project}}
/* Demo: move the calendar to the month end — the takers keep entering, two Sweihan days stay blank. */
function toMonthEnd(){
  for(const c of Object.keys(CREWS))for(const d of NOV){
    const x=day(c,d);
    if((x&&x.saved)||dayType(d)!=='work')continue;
    if(c==='sweihan'&&(d==='2026-11-07'||d==='2026-11-21'))continue;   // left blank on purpose
    DB.days[c+'|'+d]={crew:c,date:d,saved:true,rows:fillDay(c,d),by:CREWS[c].takers[0],at:`${d} 18:05`,changes:[]};
  }
  TODAY='2026-11-30';DB.feed.unshift({t:'2026-11-30 18:05',crew:'nexus',date:'2026-11-30',by:'Karthik Raj',kind:'entered'});save();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-role],[data-dev],[data-today],[data-act],[data-nav],[data-date],[data-st],[data-ed],[data-es],[data-qf],[data-why],[data-w],[data-pick],[data-open],[data-crew],[data-confirm],[data-note]');
  if(!el){if(S.bell){S.bell=false;render(true)}return;}
  const d=el.dataset;
  if(d.act==='closeEd'&&el.classList.contains('scrim')&&e.target!==el)return;
  if(d.role){applyRole(d.role);return render();}
  if(d.dev){S.dev=d.dev;closeModal();return render();}
  if(d.today){if(d.today===TODAY)return;if(d.today==='2026-11-30'){toMonthEnd();toast('Moved to 30 Nov. Reviewers now get the month-end notification.');}else{DB=seed();TODAY=REAL_TODAY;save();toast('Back to 9 Nov with the demo data restored.');}S.date=TODAY;return render(true);}
  if(d.note!==undefined){const n=myNotes()[+d.note];S.bell=false;if(n.go.view){S.view=n.go.view}else{S.crew=n.go.crew;S.date=n.go.date;S.view='take'}return render();}
  if(d.nav){S.view=d.nav;S.bell=false;closeModal();return render();}
  if(d.open){const [c,dd]=d.open.split('|');if(!R().crews.includes(c))return;if(R().nav.includes('take')){S.crew=c;S.date=dd;S.view='take';}return render();}
  if(d.crew){if(R().nav.includes('take')){S.crew=d.crew;S.date=firstOpenDate(d.crew);S.view='take';}else{S.sheetCrew=d.crew;S.view='sheets';}return render();}
  if(d.confirm){const c=d.confirm;if(!confirm(`Confirm November for ${CREWS[c].name}? The month locks and PR and Accounts see it as final.`))return;DB.months[c]={by:R().name,at:now()};DB.feed.unshift({t:now(),crew:c,date:TODAY,by:R().name,kind:'changed',what:'November confirmed — month locked'});save();toast(`${CREWS[c].name} · November confirmed.`);return render(true);}
  if(d.date){S.date=d.date;return render(true);}
  if(d.st){const [id,st]=d.st.split(':');return setStatus(id,st);}
  if(d.ed){return openEditor(d.ed);}
  if(d.es){ED.draft.st=d.es;if(d.es==='P'&&ED.draft.start==null){const sh=CREWS[S.crew].shift;Object.assign(ED.draft,{start:sh.start,fin:dayType(S.date)==='work'?sh.fin:900,brk:sh.brk.map(b=>[...b]),proj:ED.draft.proj||CREWS[S.crew].project})}return renderEditor();}
  if(d.qf){ED.draft.fin=+d.qf;return renderEditor();}
  if(d.why){ED.draft.why=d.why;return renderEditor();}
  if(d.pick){const [k,v]=d.pick.split('::');
    if(k==='proj'){ED.draft.proj=v;renderEditor();}
    if(k==='worker'){const x=day(S.crew,S.date);if(!x.rows[v]){x.rows[v]={st:null};save();toast(`${WK[v].name} added to ${dshort(S.date)} only.`);}render(true);setTimeout(()=>openEditor(v),0);}
    return;}
  if(d.w){S.worker=d.w;return render(true);}
  const a=d.act;const x=S.crew&&day(S.crew,S.date);
  if(a==='bell'){S.bell=!S.bell;return render(true);}
  if(a==='notes'){S.notes=!S.notes;return render(true);}
  if(a==='side'){S.open=!S.open;return render(true);}
  if(a==='reset'){DB=seed();TODAY=REAL_TODAY;save();S.unlock={};applyRole(S.role);toast('Demo data restored.');return render();}
  if(a==='closeEd')return closeModal();
  if(a==='edSave')return edSave(1);
  if(a==='edPrev')return edSave(-1);
  if(a==='nobrk'){ED.draft.brk=(ED.draft.brk||[]).length?[]:CREWS[S.crew].shift.brk.map(b=>[...b]);return renderEditor();}
  if(a==='allp'){for(const id of Object.keys(x.rows))if(!x.rows[id].st)setStatusQuiet(x,id);save();toast('Everyone not yet marked is present on the usual shift. Change only the exceptions.');return render(true);}
  if(a==='copy'){const p=prevDay(S.crew,S.date);for(const [id,r] of Object.entries(p.rows))x.rows[id]={...JSON.parse(JSON.stringify(r)),copied:true};save();toast(`Copied ${dshort(p.date)}. Change only what is different.`);return render(true);}
  if(a==='shift'){const sh=CREWS[S.crew].shift;const v=prompt('Usual shift for this crew — In, Out (e.g. 6:30, 5 PM)',`${tm(sh.start)}, ${tm(sh.fin)}`);if(!v)return;const [i1,o1]=v.split(',');const s1=parseT(i1).v,f1=parseT(o1,s1).v;if(s1==null||f1==null||f1<=s1)return toast('That shift was not understood. Try “6:30, 5 PM”.');sh.start=s1;sh.fin=f1;
    for(const r of Object.values(x.rows))if(r.st==='P'){r.start=s1;r.fin=f1;}save();toast(`Shift set to ${tm(s1)} – ${tm(f1)} for everyone present.`);return render(true);}
  if(a==='saveday'){x.saved=true;x.by=R().name;x.at=now();if(S.date<TODAY)x.late=true;DB.feed.unshift({t:x.at,crew:x.crew,date:x.date,by:x.by,kind:'entered'});save();
    const cr=CREWS[S.crew];toast(`${dshort(S.date)} saved.${cr.review?` ${cr.reviewer} can see it now.`:''}`);const n=missingDays(S.crew).find(m=>m!==S.date);if(n){S.date=n;toast(`${dshort(x.date)} saved. Next not entered: ${dshort(n)}.`)}return render(true);}
  if(a==='unlock'){const why=prompt(`Why are you changing ${dshort(S.date)}? ${x.by} will see this.`);if(!why||!why.trim())return toast('A reason is needed to change a day someone else entered.');S.unlock[S.crew+'|'+S.date]=why.trim();return render(true);}
  if(a==='lock'){delete S.unlock[S.crew+'|'+S.date];toast(`Changes saved. ${x.by} has been notified.`);return render(true);}
  if(a==='ask'){const q=prompt(`Your question to ${x.by} about ${dshort(S.date)}`);if(!q||!q.trim())return;x.query={by:R().name,at:now(),msg:q.trim(),open:true};DB.feed.unshift({t:now(),crew:x.crew,date:x.date,by:R().name,kind:'asked',what:q.trim()});DB.notes.unshift({to:x.by,t:now(),msg:`${R().name} asked about ${dshort(x.date)}: “${q.trim()}”`,go:{crew:x.crew,date:x.date}});save();toast(`Sent to ${x.by}.`);return render(true);}
  if(a==='answer'){const inp=document.querySelector('[data-ans]');const ans=inp&&inp.value.trim();if(!ans)return toast('Type your answer first.');x.query.open=false;x.query.answer=ans;DB.feed.unshift({t:now(),crew:x.crew,date:x.date,by:R().name,kind:'answered',what:ans});DB.notes=DB.notes.filter(n=>!(n.to===R().name&&n.go&&n.go.date===x.date));DB.notes.unshift({to:x.query.by,t:now(),msg:`${R().name} answered about ${dshort(x.date)}: “${ans}”`,go:{crew:x.crew,date:x.date}});save();toast(`Answer sent to ${x.query.by}.`);return render(true);}
  if(a==='print')return window.print();
  if(a==='csv')return exportCsv();
});

/* typing: smart times, autocomplete, statuses in the desktop grid */
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.et!==undefined||d.t){const after=d.after===''?null:+d.after;const p=parseT(t.value,after);t.classList.toggle('bad',!p.ok);const s=t.nextElementSibling;if(s&&s.tagName==='SPAN')s.textContent=p.ok&&p.v!=null?tm(p.v):p.ok?'':'Not a time';}
  if(d.ac){const box=document.getElementById('sug-'+d.ac);const q=t.value;
    if(d.ac==='proj')ED.draft.proj=q;
    if(!q.trim()){box.hidden=true;return}
    const res=d.ac==='proj'?fuzzy(q,PROJECTS,p=>p):fuzzy(q,W.filter(w=>!day(S.crew,S.date).rows[w.id]),w=>w.name+' '+w.no);
    const top=res[0];const dym=top&&top.sc>=2?`<div class="dym">Did you mean “${d.ac==='proj'?top.it:top.it.name}”?</div>`:'';
    box.innerHTML=res.length?dym+res.map(x=>d.ac==='proj'?`<button data-pick="proj::${esc(x.it)}"><span>${ic('hier')}</span><span><b>${x.it}</b></span></button>`:`<button data-pick="worker::${x.it.id}"><span class="wav" style="width:32px;height:32px;font-size:11px">${ini(x.it.name)}</span><span><b>${x.it.name}</b><small>${x.it.no} · ${x.it.trade} · ${x.it.crew?CREWS[x.it.crew].name:'Labour pool'}</small></span></button>`).join(''):`<div class="dym" style="color:var(--mut)">No match — check the spelling or ask Admin to add the worker.</div>`;
    box.hidden=false;}
  if(d.sq!==undefined){S.sheetQ=t.value;render(true);const n=document.querySelector('[data-sq]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  if(d.whyIn!==undefined)ED.draft.why=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.sel==='role'){applyRole(t.value);return render();}
  if(d.sel==='crew'){S.crew=t.value;S.date=R().take?TODAY:firstOpenDate(S.crew);return render(true);}
  if(d.sel==='sheetCrew'){S.sheetCrew=t.value;return render(true);}
  if(d.sel&&d.sel.startsWith('st:')){setStatus(d.sel.slice(3),t.value||null);return;}
  if(d.et){const p=parseT(t.value,d.after===''?null:+d.after);if(!p.ok)return;const r=ED.draft;if(d.et==='start')r.start=p.v;else if(d.et==='fin')r.fin=p.v;else{r.brk=r.brk&&r.brk.length?r.brk:[[null,null]];r.brk[0][d.et==='b0'?0:1]=p.v;}renderEditor();
    const nx={start:'b0',b0:'b1',b1:'fin'}[d.et];const n=nx&&document.querySelector(`[data-et="${nx}"]`);if(n)n.focus();}
  if(d.t){const [id,f]=d.t.split(':');const x=day(S.crew,S.date),r=x.rows[id];const before=rowWhat(r);const p=parseT(t.value,d.after===''?null:+d.after);if(!p.ok)return;
    if(f==='start')r.start=p.v;else if(f==='fin')r.fin=p.v;else{r.brk=r.brk&&r.brk.length?r.brk:[[null,null]];r.brk[0][f==='b0'?0:1]=p.v;}r.copied=false;if(before!==rowWhat(r))logChange(x,id,`${before} → ${rowWhat(r)}`);save();
    const pos=[...document.querySelectorAll('.grid-in input.t:not([disabled])')].indexOf(t);render(true);const all=[...document.querySelectorAll('.grid-in input.t:not([disabled])')];if(all[pos+1])all[pos+1].focus();}
  if(d.proj){const x=day(S.crew,S.date);const m=fuzzy(t.value,PROJECTS,p=>p)[0];x.rows[d.proj].proj=m?m.it:t.value;save();render(true);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ED)closeModal();if(S.bell){S.bell=false;render(true)}}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.ac){const b=document.querySelector('#sug-'+e.target.dataset.ac+' button');if(b){e.preventDefault();b.click()}}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(true),150)});
applyRole('se');
// Links can open a role and screen directly: #role=pe&view=review&dev=desktop
try{const h=new URLSearchParams(location.hash.slice(1));if(ROLES[h.get('role')])applyRole(h.get('role'));if(NAVDEF[h.get('view')]&&R().nav.includes(h.get('view')))S.view=h.get('view');if(['phone','desktop'].includes(h.get('dev')))S.dev=h.get('dev');if(h.get('notes')==='0')S.notes=false;}catch(e){}
render();
