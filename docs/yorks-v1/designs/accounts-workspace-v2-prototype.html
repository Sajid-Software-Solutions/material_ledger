<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yorks Project Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8FC;--chrome:#F9FBFD;--card:#fff;--obg:var(--bg);
  --line:#E0E6ED;--line2:#EDF1F6;--lineS:#C8D2DF;--cardb:#D8E2EE;
  --ink:#132033;--ink2:#34435A;--mut:#6B788C;--mut2:#8F9AAE;--navy:#0D2F57;
  --pri:#1D68D9;--pri-d:#1757B8;--pri-50:#EAF2FF;--pri-100:#C9DCFF;--pri-ink:#1F55B8;--pri-l:#8FB4F0;
  --ok:#0D8B63;--ok-50:#E9F8F2;--okI:#2E9A63;
  --warn:#AD6A00;--warn-50:#FFF5DF;--org:#D2742C;
  --bad:#C23737;--bad-50:#FFF0F0;
  --vio:#6D4BD1;--vio-50:#F2EDFF;
  --neu:#F1F4F7;--neuT:#536175;
  --r:14px;--gap:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:21px;height:21px}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
.app.open{grid-template-columns:260px minmax(0,1fr)}
.side{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;overflow:hidden}
.brand{height:68px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
.brand img{width:36px;height:36px;border-radius:50%;box-shadow:0 1px 4px rgba(19,32,51,.22);flex:none}
.brand .bt{display:none;min-width:0}
.brand .bt b{display:block;font-size:14px;color:var(--ink);white-space:nowrap}.brand .bt span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.open .brand .bt{display:block}
.side nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 6px;scrollbar-width:none}
.side h6{display:none;margin:14px 16px 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:700;white-space:nowrap}
.side h6:first-child{margin-top:4px}
.app.open .side h6{display:block}
.nav{display:flex;align-items:center;gap:14px;height:43px;padding:0 0 0 26px;border-radius:10px;color:var(--ink2);cursor:pointer;margin-bottom:1px;white-space:nowrap;font-size:13px;font-weight:500}
.nav svg.i{width:20px;height:20px}
.nav span{display:none}.app.open .nav span{display:inline}
.nav:hover{background:#EEF3F9}.nav.on{background:var(--pri-50);color:var(--pri);font-weight:700}
.me{margin:8px 6px 10px;border:1px solid var(--line);border-radius:12px;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;background:#fff;flex:none;position:relative}
.me:hover{border-color:var(--lineS)}
.app.open .me{justify-content:flex-start;padding:0 10px}
.me .mt{display:none;min-width:0;flex:1}.app.open .me .mt{display:block}
.me .mt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me .mt span{display:block;font-size:11px;color:var(--mut);white-space:nowrap}
.me .chev2{display:none;color:var(--mut)}.app.open .me .chev2{display:block}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri-50);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:12px;flex:none;position:relative}
.av.on:after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#2DA66E;border:2px solid #fff}
#meMenu{position:fixed;left:12px;bottom:76px;width:250px;background:#fff;border:1px solid var(--cardb);border-radius:14px;box-shadow:0 12px 36px rgba(19,32,51,.18);padding:8px;z-index:60}
#meMenu h6{margin:6px 8px 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:700}
.mm{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;text-align:left}
.mm:hover{background:var(--bg)}.mm.on{background:var(--pri-50)}
.mm b{display:block;font-size:12.5px}.mm small{display:block;font-size:11px;color:var(--mut)}
main{min-width:0}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 20px 0 22px;border-bottom:1px solid var(--line);background:var(--chrome)}
.tbi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);cursor:pointer;border:0;background:none;flex:none;position:relative}
.tbi:hover{background:#EEF3F9}.tbi.dim{color:var(--mut2)}
.tbi svg.i{width:20px;height:20px}
.crumb{margin-left:14px;color:var(--mut);white-space:nowrap;font-size:13px}.crumb b{color:var(--ink);font-weight:700}
.search{margin-left:auto;margin-right:10px;width:300px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;color:var(--mut);font-size:13px;cursor:text}
.kbd{margin-left:auto;background:var(--neu);color:var(--neuT);font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--chrome);line-height:1}
.conn{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;font-weight:600;margin-left:8px;white-space:nowrap}.conn svg{color:#2DA66E}

.phead{background:#fff;padding:20px 24px 0;border-bottom:1px solid var(--line)}
.ph-row{display:flex;align-items:flex-start;gap:16px}
.ph-t{flex:1;min-width:0}
.kick{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mut)}
.phead h1{margin:3px 0 6px;font-size:24px;line-height:1.22;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:-.005em}
.loc{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}
.ph-a{display:flex;gap:10px;align-items:center;flex:none}
.ptabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.ptab{padding:0 12px;height:40px;display:flex;align-items:center;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:13px}
.ptab:first-child{padding-left:12px}
.ptab.on{color:var(--pri);border-color:var(--pri)}
.wrap{padding:16px 18px 56px;min-width:0}

/* accounts sub-tabs (same pattern as the live Accounts tab) */
.subbar{display:flex;align-items:center;gap:12px;margin-bottom:var(--gap)}
.atabs{flex:1;min-width:0;display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.atab{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:0;background:none;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;color:var(--ink2);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
.atab svg.i{width:17px;height:17px}
.atab:hover{background:#EEF3FA}
.atab.on{background:var(--pri-50);color:var(--pri);font-weight:700;border-bottom-color:var(--pri)}
.atab .bdg{font-size:10px;min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:var(--warn-50);color:var(--warn);font-weight:700;display:grid;place-items:center}
.atab .bdg.bad{background:var(--bad-50);color:var(--bad)}
.subact{display:flex;gap:10px;flex:none}
.subact:empty{display:none}

/* ===== primitives ===== */
.card{background:var(--card);border:1px solid var(--cardb);border-radius:var(--r);min-width:0;--obg:#fff}
.stack{display:grid;gap:var(--gap);min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.ch{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 8px}
.ch .ci{color:var(--pri);flex:none;margin-top:1px;display:flex}
.ch .ci svg.i{width:21px;height:21px}
.cht{min-width:0;flex:1}
.ch h3{margin:0;font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.ch p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.ch .ca{display:flex;gap:8px;align-items:center;flex:none;margin-left:auto}
.ch.tile{align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:14px}
.ti{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.ti svg.i{width:21px;height:21px}
.t-blue{background:#EAF1FB;color:var(--pri)}.t-green{background:#E9F6F0;color:var(--okI)}.t-vio{background:#F1EEFB;color:var(--vio)}.t-org{background:#FBF1E8;color:var(--org)}.t-red{background:#FCEDED;color:var(--bad)}.t-neu{background:var(--neu);color:var(--neuT)}
.cb{padding:8px 18px 16px}
.cb.flush{padding:0}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;height:36px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap;font-size:13px}
.btn svg.i{width:17px;height:17px}
.btn:hover{background:#F3F7FC;border-color:var(--lineS)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;border-radius:999px;padding:0 18px}.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri)}.btn.ghost:hover{background:var(--pri-50)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px;gap:6px}.btn.sm svg.i{width:15px;height:15px}
.btn.pri.sm{border-radius:999px;padding:0 14px}
.btn.lg{height:44px;padding:0 18px;font-size:13.5px;border-radius:12px;gap:10px}.btn.lg svg.i{width:19px;height:19px}
.btn.pri.lg{border-radius:999px;padding:0 24px}
.btn.icon{width:30px;padding:0}
.btn.dots{border-color:transparent;background:transparent;width:44px;padding:0}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--neu);color:var(--neuT);vertical-align:middle}
.chip svg.i{width:13px;height:13px}
.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.warn{background:var(--warn-50);color:var(--warn)}.chip.bad{background:var(--bad-50);color:var(--bad)}.chip.pri{background:var(--pri-50);color:var(--pri)}.chip.vio{background:var(--vio-50);color:var(--vio)}
.muted{color:var(--mut)}.small{font-size:12px}.b{font-weight:700}.right{text-align:right}.nw{white-space:nowrap}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* KPI cards */
.kgrid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(188px,1fr))}
.kpi{display:flex;align-items:center;gap:10px;padding:14px 12px;min-height:86px}
.kpi .kb{min-width:0;flex:1}
.kl{font-size:12px;color:var(--ink2);line-height:1.35}
.kn{font-size:16px;font-weight:700;color:var(--ink);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kn.ok{color:var(--ok)}.kn.bad{color:var(--bad)}.kn.warn{color:var(--warn)}.kn.vio{color:var(--vio)}
.ks{font-size:12px;color:var(--ink2);line-height:1.35}

/* outlined field — same as the live filter dropdowns */
.of{position:relative;display:flex;align-items:center;border:1px solid var(--lineS);border-radius:8px;background:#fff;height:36px;min-width:0}
.of:hover{border-color:#9FAEC2}
.of:focus-within{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.of>.ofl{position:absolute;top:-8px;left:9px;padding:0 4px;font-size:10.5px;line-height:14px;color:var(--mut);background:linear-gradient(to bottom,var(--obg) 55%,#fff 55%);white-space:nowrap;max-width:calc(100% - 18px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.of select,.of input{border:0;outline:0;background:transparent;width:100%;height:100%;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink);min-width:0;border-radius:8px}
.of select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;text-overflow:ellipsis}
.of input.n{text-align:right;font-variant-numeric:tabular-nums}
.of input[type=date]{font-size:13.5px}
.of .car{position:absolute;right:9px;pointer-events:none;color:var(--ink2);width:20px;height:20px}
.of .lead{margin-left:10px;color:var(--mut)}
.of .lead+input{padding-left:8px}
.of.lg{height:42px}
.of.sm{height:32px}.of.sm select{font-size:12.5px;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:6px}
.filters .of{width:228px}
.filters .of.w{width:300px}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px}
.toolrow .of{width:340px}

/* key/value rows */
.kvr{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:31px;padding:6px 0;font-size:12.5px;color:var(--mut)}
.kvr b{font-size:12px;color:var(--ink);white-space:nowrap}
.kvr b.bad{color:var(--bad)}.kvr b.ok{color:var(--ok)}.kvr b.vio{color:var(--vio)}
.kvr.sum{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;color:var(--ink);font-weight:700}
.kvr.sum b{font-size:13px}
.ldr{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:center;min-height:40px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.ldr b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ldr b.ok{color:var(--ok)}.ldr b.bad{color:var(--bad)}.ldr b.vio{color:var(--vio)}
.ld{padding:16px 18px 18px}
.ld-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ld-h h3{margin:0;font-size:17px;font-weight:700}
.ld-t{font-size:22px;font-weight:700;margin:14px 0 0;line-height:1.2;color:var(--ink)}
.ld-s{font-size:12.5px;color:var(--ink2);margin:3px 0 8px}
.netbox{margin:12px 0 4px;background:var(--pri-50);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.netbox span{font-size:12px;color:var(--ink2)}
.netbox b{font-size:19px;color:var(--navy);font-variant-numeric:tabular-nums}
.netbox small{font-size:11px;color:var(--ink2);line-height:1.35}
.ld .acts{display:grid;gap:8px;margin-top:14px}
.ld .acts .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* info note — same as "Held cheques do not reduce Still Due" */
.note{display:flex;gap:10px;align-items:center;background:#F1F6FE;border:1px solid #DCE8FB;border-left:3px solid #7BA8EE;border-radius:8px;padding:10px 14px;color:var(--ink2);font-size:12.5px;line-height:1.45;--obg:#F1F6FE}
.note>div{flex:1;min-width:0}
.note>svg.i{color:var(--pri)}
.note.warn{background:#FFF8EA;border-color:#F6E2B8;border-left-color:#E0A33A;--obg:#FFF8EA}.note.warn>svg.i{color:var(--warn)}
.note.bad{background:#FFF4F4;border-color:#F6D3D3;border-left-color:#E07A7A;--obg:#FFF4F4}.note.bad>svg.i{color:var(--bad)}
.note.ok{background:#F0FAF6;border-color:#CDEBDD;border-left-color:#5DBB93;--obg:#F0FAF6}.note.ok>svg.i{color:var(--ok)}
.proto{margin-bottom:var(--gap)}
.proto .pn-a{display:flex;gap:8px;align-items:center;flex:none}
.proto .of{width:272px}
.how{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 14px}
.how code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink);font-family:inherit;font-size:12px}
.ra{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.ra>b{font-size:16px;margin-right:4px}

/* tables */
.tw{overflow:auto}
.tw.boxed{border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#F7F9FC;color:var(--mut);font-weight:700;font-size:11px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;height:46px}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FBFF}
tfoot td{background:#F7F9FC;font-weight:700;border-top:1px solid var(--line);height:42px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
td.act{text-align:right;width:56px;white-space:nowrap}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:8px;padding:0 10px;height:34px;background:#fff;width:100%;min-width:0;font-size:13px;color:var(--ink)}
input.in:hover,select.in:hover{border-color:var(--lineS)}
input.in:focus,select.in:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
input.in.n{text-align:right;font-variant-numeric:tabular-nums}
input.in.qty{text-align:right;font-weight:700}
input.in::placeholder,.of input::placeholder{color:var(--mut2);font-weight:400}
input.in.err{border-color:var(--bad);background:var(--bad-50)}
input.in:disabled{background:var(--bg);color:var(--ink2);border-color:transparent}
.field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:5px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px}
.fgrid .full{grid-column:1/-1}
.bar,.pbar{height:8px;border-radius:8px;background:#DFE7F0;overflow:hidden;display:flex}
.bar>i,.pbar>i{display:block;height:100%}
.bar{height:6px}

/* overview */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.step{padding:14px 18px;border-right:1px solid var(--line2);cursor:pointer;display:flex;gap:12px;align-items:center;min-width:0}
.step:last-child{border-right:0}.step:hover{background:#F8FBFF}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--neu);color:var(--neuT);flex:none}
.step.done .n{background:var(--ok-50);color:var(--ok)}.step.cur .n{background:var(--pri);color:#fff}
.step h4{margin:0;font-size:13px;color:var(--ink)}
.step p{margin:1px 0 0;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step>div{min-width:0}
.ov3{display:grid;grid-template-columns:minmax(0,1.66fr) minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.att{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.att:first-child{border-top:0}
.att .ti{width:38px;height:38px;border-radius:10px}.att .ti svg.i{width:18px;height:18px}
.att .t{font-weight:700;color:var(--ink);font-size:13px}.att .d{color:var(--ink2);font-size:12px}
.bpr{display:grid;grid-template-columns:72px minmax(0,1fr) 46px;gap:12px;align-items:center;min-height:38px}
.bpr .bl{font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bpr .pbar{height:26px;border-radius:5px}

.pipeline div.done{color:var(--ok);font-weight:600}.pipeline div.done:before,.pipeline div.done:after{background:var(--ok)}

/* modal / drawer */

@keyframes up{from{transform:translateY(8px);opacity:0}}
.fx.ex{display:block;line-height:1.6}

/* ===== A4 invoice ===== */

@media (max-width:1320px){.ov3{grid-template-columns:repeat(2,minmax(0,1fr))}.ov3>:first-child{grid-column:1/-1}}

}

<script>
/* =========================================================
   Yorks — Project Accounts prototype (single file, no deps)
   Mechanism mirrors the Yorks billing workbook:
   contract → buildings (share %) → stages (% of contract)
   → item weights (% of contract per building) × qty claimed.
   ========================================================= */
const LOGO=document.querySelector('.brand img').src;
const STORE='yorks-project-accounts-proto-v5';
const USERS=[
  {name:'Masaud Khan',role:'Project Engineer',ini:'MK'},
  {name:'Ali M Hadba',role:'Project Manager',ini:'AH'},
  {name:'S. Santhosh',role:'Chief Accountant',ini:'SS'},
];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayIso=iso(TODAY);
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+Number(n||0));return iso(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const fDate=s=>{if(!s)return'—';const d=parseD(s);return `${String(d.getDate()).padStart(2,'0')} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const fDot=s=>{if(!s)return'—';const d=parseD(s);return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`};
const fMonth=s=>{if(!s)return'—';const d=parseD(s);return `${MON[d.getMonth()]} ${d.getFullYear()}`};
const r2=n=>Math.round((Number(n)||0)*100)/100;
const fmt=(n,d=2)=>{n=Number(n)||0;const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return (n<-0.004?'-':'')+s};
const aed=(n,d=2)=>'AED '+fmt(n,d);
const pc=(n,d=1)=>fmt(n,d)+'%';

/* ---------- core mechanism ---------- */
const CV=()=>Number(S.project.contractValue)||0;
const VAT=()=>(Number(S.project.vat)||0)/100;
const stageById=id=>S.stages.find(s=>s.id===id);
const bldById=id=>S.buildings.find(b=>b.id===id);
const claimByNo=n=>S.claims.find(c=>c.no===n);
const invByClaim=n=>S.invoices.find(i=>i.claimNo===n);
const invNo=inv=>inv.rev?`${inv.base}R.${inv.rev}`:inv.base;
const stageItems=s=>s?(S.items[s.id]=S.items[s.id]||[]):[];
const stageVal=(b,s)=>CV()*(Number(b.share)||0)/100*(Number(s.pct)||0)/100;
const itemVal=it=>CV()*(Number(it.w)||0)/100;
const curUser=()=>USERS[S.user]||USERS[0];
const cno=n=>'#'+pad2(n);

function readP(c,bid,sid){const s=stageById(sid);const v=c.progress?.[bid]?.[sid];if(!s)return 0;if(s.mode==='lump')return typeof v==='number'?v:0;return v&&typeof v==='object'?v:{}}
function writeP(c,bid,sid,val){c.progress[bid]=c.progress[bid]||{};c.progress[bid][sid]=val}
const priorClaims=c=>S.claims.filter(x=>x.no<c.no);
function prevLump(c,bid,sid){return priorClaims(c).reduce((a,x)=>a+readP(x,bid,sid),0)}
function prevQty(c,bid,sid,itemId){return priorClaims(c).reduce((a,x)=>a+(Number(readP(x,bid,sid)[itemId])||0),0)}
function bsAmount(c,b,s){
  if(s.mode==='lump') return stageVal(b,s)*(Number(readP(c,b.id,s.id))||0)/100;
  const p=readP(c,b.id,s.id);
  return stageItems(s).reduce((a,it)=>a+(it.qty?itemVal(it)*(Number(p[it.id])||0)/it.qty:0),0);
}
function computeClaim(c){
  const byBS={},byStage={},byB={};let gross=0;
  S.buildings.forEach(b=>{byBS[b.id]={};byB[b.id]=0;S.stages.forEach(s=>{const v=bsAmount(c,b,s);byBS[b.id][s.id]=v;byStage[s.id]=(byStage[s.id]||0)+v;byB[b.id]+=v;gross+=v})});
  return {byBS,byStage,byB,gross};
}
/* issued invoices keep a frozen snapshot so later edits to the breakdown never change them */
function claimAmounts(c){const inv=invByClaim(c.no);if(c.status==='invoiced'&&inv&&inv.snap)return inv.snap;return computeClaim(c)}
function snapAll(){S.invoices.forEach(inv=>{const c=claimByNo(inv.claimNo);if(c)inv.snap=computeClaim(c)})}

function invCalc(inv){
  const raw=inv.snap?.gross||0,gross=r2(raw),vat=r2(raw*VAT()),total=r2(raw*(1+VAT()));
  const payable=inv.cert&&Math.abs(inv.cert.amount-gross)>EPS?r2(inv.cert.amount*(1+VAT())):total;
  const pays=inv.payments||[];
  const received=pays.filter(p=>p.type!=='pdc'||p.status==='cleared').reduce((a,p)=>a+Number(p.amount||0),0);
  const inHand=pays.filter(p=>p.type==='pdc'&&(p.status==='inhand'||p.status==='deposited')).reduce((a,p)=>a+Number(p.amount||0),0);
  const balance=r2(payable-received);
  const due=addDays(inv.submitted||inv.date,S.project.terms);
  const paid=balance<=EPS;
  const lastPay=pays.filter(p=>p.type!=='pdc'||p.status==='cleared').map(p=>p.clearedDate||p.received).sort().pop();
  const overdue=!paid&&todayIso>due&&inv.status!=='revising';
  const delay=paid?(lastPay?diffDays(due,lastPay):0):(todayIso>due?diffDays(due,todayIso):0);
  let st,cls;
  if(inv.status==='revising'){st='Being revised';cls='vio'}
  else if(paid){st='Paid';cls='ok'}
  else if(overdue){st='Overdue';cls='bad'}
  else if(received>EPS){st='Part paid';cls='warn'}
  else if(inv.cert){st='Certified';cls='pri'}
  else {st='Submitted';cls=''}
  return {gross,vat,total,payable,received,inHand,balance,due,paid,overdue,delay,st,cls,lastPay};
}
function billCalc(b){
  const vat=b.amount*VAT(),total=b.amount+vat,paid=(b.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0);
  const balance=r2(total-paid),due=addDays(b.date,b.terms);const done=balance<=EPS;const overdue=!done&&todayIso>due;
  return {vat,total,paid,balance,due,done,overdue,st:done?'Paid':overdue?'Overdue':paid>EPS?'Part paid':'Unpaid',cls:done?'ok':overdue?'bad':paid>EPS?'warn':''};
}
function overall(){
  let invoiced=0,received=0,inHand=0,payable=0,overdueAmt=0,overdueN=0;
  S.invoices.forEach(inv=>{const x=invCalc(inv);if(inv.status!=='revising')invoiced+=x.gross;received+=x.received;inHand+=x.inHand;payable+=x.payable;if(x.overdue){overdueAmt+=x.balance;overdueN++}});
  const draft=S.claims.filter(c=>c.status!=='invoiced').reduce((a,c)=>a+computeClaim(c).gross,0);
  const bills=S.bills.map(billCalc);
  const billsTotal=bills.reduce((a,b)=>a+b.total,0),billsPaid=bills.reduce((a,b)=>a+b.paid,0);
  const vo=S.variations.filter(v=>v.status==='Approved').reduce((a,v)=>a+Number(v.amount||0),0);
  return {cv:CV(),vo,invoiced,received,inHand,payable,outstanding:r2(payable-received),overdueAmt,overdueN,draft,billsTotal,billsPaid,billsUnpaid:billsTotal-billsPaid,billsOverdue:bills.filter(b=>b.overdue).length};
}
function invoicedBS(beforeNo=Infinity){
  const out={};S.buildings.forEach(b=>{out[b.id]={};S.stages.forEach(s=>out[b.id][s.id]=0)});
  S.claims.filter(c=>c.status==='invoiced'&&c.no<beforeNo).forEach(c=>{const a=claimAmounts(c);S.buildings.forEach(b=>S.stages.forEach(s=>{out[b.id][s.id]+=a.byBS?.[b.id]?.[s.id]||0}))});
  return out;
}
function setupChecks(){
  const out=[];
  out.push({ok:CV()>0,t:'Contract value entered',d:CV()>0?aed(CV()):'Enter the contract value (excl. VAT)'});
  const bs=S.buildings.reduce((a,b)=>a+(Number(b.share)||0),0);
  out.push({ok:Math.abs(bs-100)<EPS&&S.buildings.length>0,t:'Buildings add up to 100%',d:`Currently ${pc(bs,2)}`+(Math.abs(bs-100)<EPS?'':` — ${bs<100?'missing':'over by'} ${pc(Math.abs(100-bs),2)}`)});
  const ss=S.stages.reduce((a,s)=>a+(Number(s.pct)||0),0);
  out.push({ok:Math.abs(ss-100)<EPS,t:'Billing stages add up to 100%',d:`Currently ${pc(ss,2)}`+(Math.abs(ss-100)<EPS?'':` — ${ss<100?'missing':'over by'} ${pc(Math.abs(100-ss),2)}`)});
  S.stages.filter(s=>s.mode==='items').forEach(s=>{
    const need=S.buildings.length?(Number(S.buildings[0].share)||0)*(Number(s.pct)||0)/100:0;
    const have=stageItems(s).reduce((a,i)=>a+(Number(i.w)||0),0);
    const ok=Math.abs(have-need)<0.0005&&stageItems(s).length>0;
    out.push({ok,sid:s.id,t:`${s.name}: items add up`,d:`Items ${fmt(have,3)}% of contract · needed ${fmt(need,3)}% per building`+(ok?'':` (${have<need?'short':'over'} by ${aed(Math.abs(need-have)*CV()/100)})`)});
  });
  return out;
}

function words(n){
  n=r2(n);const A=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],B=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const h=x=>{let s='';if(x>=100){s+=A[Math.floor(x/100)]+' Hundred';x%=100;if(x)s+=' '}if(x>=20){s+=B[Math.floor(x/10)];if(x%10)s+=' '+A[x%10]}else if(x)s+=A[x];return s};
  let w=Math.floor(n+1e-9),f=Math.round((n-w)*100);if(f===100){w++;f=0}
  const parts=[];[[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']].forEach(([v,l])=>{if(w>=v){parts.push(h(Math.floor(w/v))+' '+l);w%=v}});if(w)parts.push(h(w));
  return 'UAE Dirham '+(parts.join(' ')||'Zero')+(f?` & ${pad2(f)}/100`:'')+' Only';
}

    (inv.payments||[]).filter(p=>p.type==='pdc').forEach(p=>{const dd=diffDays(todayIso,p.chequeDate);
      if(p.status==='inhand'&&dd<=0)L.push({sev:'warn',icon:'cheque',t:`Deposit cheque ${p.chequeNo} — it is due`,d:`${aed(p.amount)} for ${no} · cheque date ${fDate(p.chequeDate)}`,act:'inv',id:inv.id,btn:'Open invoice'});

  });

  S.bills.forEach(b=>{const x=billCalc(b);if(x.overdue)L.push({sev:'warn',icon:'box',t:`Supplier bill ${b.billNo} overdue`,d:`${b.supplier} · ${aed(x.balance)} unpaid · due ${fDate(x.due)}`,act:'bill',id:b.id,btn:'Open bill'});if(!b.matched&&!x.done)L.push({sev:'warn',icon:'truck',t:`${b.billNo} has no delivery linked`,d:`${b.supplier} · confirm the material arrived before paying`,act:'bill',id:b.id,btn:'Check bill'})});

LIVE.setupKpis=()=>{const chk=setupChecks();const bad=chk.filter(c=>!c.ok).length;const its=S.stages.filter(s=>s.mode==='items');const nIt=its.reduce((a,s)=>a+stageItems(s).length,0);
  const bs=S.buildings.reduce((a,b)=>a+(Number(b.share)||0),0);const ss=S.stages.reduce((a,s)=>a+(Number(s.pct)||0),0);
  return kpi('doc','pri','Contract value',aed(CV(),0),`Excluding VAT · ${aed(CV()*(1+VAT()),0)} with VAT`)+
    kpi('bldg','pri','Physical buildings',String(S.buildings.length),`Shares total ${pc(bs,2)}`,Math.abs(bs-100)<EPS?'':'bad')+
    kpi('chart','vio','Billing stages',String(S.stages.length),S.stages.map(s=>pc(s.pct,0)).join(' / ')||'—',Math.abs(ss-100)<EPS?'':'bad')+
    kpi('list','pri','Item breakdown',`${nIt} items`,its.map(s=>esc(s.name)).join(' · ')||'No item-measured stages')+
    kpi(bad?'alert':'check',bad?'bad':'ok','Setup check',bad?`${bad} to fix`:'Ready',bad?'Fix before the next claim':`All ${chk.length} checks passed`,bad?'bad':'ok')};
LIVE.setupPanel=()=>{const chk=setupChecks();const bad=chk.filter(c=>!c.ok).length;
  return `<div class="ld-h"><h3>Setup check</h3>${chipFor(bad?`${bad} to fix`:'Ready',bad?'bad':'ok')}</div><div class="ld-t">Contract setup</div><div class="ld-s">${esc(S.project.code)} · updates as you type</div>${LIVE.checks()}`};
LIVE.vatline=()=>`Contract incl. VAT <b>${aed(CV()*(1+VAT()))}</b> &nbsp;·&nbsp; Due date = submission + <b>${S.project.terms} days</b> &nbsp;·&nbsp; Next invoice no. <b>${nextInvoiceBase()}</b>`;
LIVE.bval=el=>aed(CV()*(Number(S.buildings[+el.dataset.i]?.share)||0)/100);
LIVE.bsum=()=>{const v=S.buildings.reduce((a,b)=>a+(Number(b.share)||0),0);return `<span style="color:${Math.abs(v-100)<EPS?'var(--ok)':'var(--bad)'}">${pc(v,2)}</span>`};
LIVE.bsumv=()=>aed(CV()*S.buildings.reduce((a,b)=>a+(Number(b.share)||0),0)/100);
LIVE.sval=el=>aed(CV()*(Number(S.stages[+el.dataset.i]?.pct)||0)/100);
LIVE.ssum=()=>{const v=S.stages.reduce((a,b)=>a+(Number(b.pct)||0),0);return `<span style="color:${Math.abs(v-100)<EPS?'var(--ok)':'var(--bad)'}">${pc(v,2)}</span>`};
LIVE.ssumv=()=>aed(CV()*S.stages.reduce((a,b)=>a+(Number(b.pct)||0),0)/100);
LIVE.ival=el=>{const it=S.items[el.dataset.s]?.[+el.dataset.i];return it?fmt(itemVal(it)):''};
LIVE.irate=el=>{const it=S.items[el.dataset.s]?.[+el.dataset.i];return it&&it.qty>1?`${fmt(itemVal(it)/it.qty)} / ${esc(it.unit)}`:''};
LIVE.isum=el=>fmt(stageItems(stageById(el.dataset.s)).reduce((a,i)=>a+(Number(i.w)||0),0),3)+'%';
LIVE.isumv=el=>fmt(stageItems(stageById(el.dataset.s)).reduce((a,i)=>a+itemVal(i),0));
LIVE.icheck=el=>{const s=stageById(el.dataset.s);const c=setupChecks().find(c=>c.sid===s.id);if(!c)return'';return `<div class="note ${c.ok?'ok':'warn'}">${ic(c.ok?'check':'alert')}<div>${c.ok?`Items add up exactly to ${esc(s.name)} for one building (${aed(stageVal(S.buildings[0],s))}).`:esc(c.d)}</div></div>`};
LIVE.checks=()=>setupChecks().map(c=>`<div class="check ${c.ok?'ok':'bad'}"><span class="ic2">${c.ok?'✓':'!'}</span><div><b>${esc(c.t)}</b><div class="muted small">${esc(c.d)}</div></div></div>`).join('');
LIVE.example=()=>{const s=S.stages.find(s=>s.mode==='items'&&stageItems(s).length);if(!s)return'';const it=stageItems(s).find(i=>i.qty>1)||stageItems(s)[0];const q=Math.max(1,Math.round(it.qty/3));return `<b style="color:var(--ink)">Example:</b> ${q} of ${it.qty} ${esc(it.name)}<br>${fmt(itemVal(it))} × ${q} ÷ ${it.qty} = <b style="color:var(--ink)">${aed(itemVal(it)*q/it.qty)}</b>`};
function nextNo(){return (S.claims.length?Math.max(...S.claims.map(c=>c.no)):0)+1}
function nextInvoiceBase(){const d=S.claims.find(c=>c.status!=='invoiced'&&!invByClaim(c.no));return S.project.prefix+pad2(d?d.no:nextNo())}

/* =========================================================
   PROGRESS & CLAIMS
   ========================================================= */
function suggestionsFor(c){
  if(!c||c.status==='invoiced')return[];
  return S.evidence.filter(e=>{const s=stageById(e.s),b=bldById(e.b);if(!s||!b||s.mode!=='items')return false;const it=stageItems(s).find(i=>i.id===e.item);if(!it)return false;const prev=prevQty(c,e.b,e.s,e.item);const cur=Number(readP(c,e.b,e.s)[e.item])||0;return Math.min(e.qty,it.qty)-prev-cur>EPS});
}
const curClaim=()=>claimByNo(S.ui.claim);
const priorBS=(c,bid,sid)=>S.claims.filter(x=>x.no<c.no).reduce((a,x)=>a+(claimAmounts(x).byBS?.[bid]?.[sid]||0),0);
const nowBS=(c,bid,sid)=>claimAmounts(c).byBS?.[bid]?.[sid]||0;
function lineMatch(c,b,s){const f=S.ui.fShow||'all';if(f==='all')return true;
  if(f==='claimed')return nowBS(c,b.id,s.id)>EPS;
  if(f==='sug')return suggestionsFor(c).some(e=>e.b===b.id&&e.s===s.id);
  if(f==='open')return priorBS(c,b.id,s.id)+nowBS(c,b.id,s.id)<stageVal(b,s)-EPS;
  return true}
const barHtml=(before,now,tot)=>{const pb=tot?before/tot*100:0,pn=tot?now/tot*100:0;const over=pb+pn>100.01;
  return `<div class="pbar" title="Before this claim ${pc(pb)} · this claim ${pc(pn)}"><i style="width:${Math.min(100,pb)}%;background:var(--pri)"></i><i style="width:${Math.max(0,Math.min(100-pb,pn))}%;background:${over?'var(--bad)':'var(--pri-l)'}"></i></div><span class="wb-p ${over?'over':''}">${pc(pb+pn)}</span>`};

VIEWS.claims=()=>{
  if(!S.buildings.length||!S.stages.length) return `<div class="card">${emptyState('hier','Nothing to claim yet','Add at least one building and one billing stage in Contract first.',`<button class="btn" data-act="tab" data-tab="setup">Open Contract</button>`)}</div>`;
  if(!S.claims.length) return `<div class="card">${emptyState('chart','No claims yet','Each month, record how much work was done. The app works out the amount and builds the invoice.',`<button class="btn" data-act="newclaim">${ic('plus','sm')}Start claim #01</button>`)}</div>`;
  let c=curClaim();if(!c){c=S.claims[S.claims.length-1];S.ui.claim=c.no}
  const u=S.ui;u.openB=u.openB||[S.buildings[0].id];u.openS=u.openS||[];u.fB=u.fB||'all';u.fS=u.fS||'all';u.fShow=u.fShow||'all';
  if(u.fB!=='all'&&!bldById(u.fB))u.fB='all';if(u.fS!=='all'&&!stageById(u.fS))u.fS='all';
  const ro=c.status==='invoiced';const inv=invByClaim(c.no);
  const hasDraft=S.claims.some(x=>x.status!=='invoiced');
  const claimOpts=S.claims.slice().reverse().map(x=>{const iv=invByClaim(x.no);return [x.no,`Claim ${cno(x.no)} · ${fMonth(x.month)} · ${x.status==='invoiced'?(iv?invNo(iv):'Invoiced'):x.status==='checked'?'Checked':'Draft'}`]});
  const filtering=u.fB!=='all'||u.fS!=='all'||u.fShow!=='all';
  const rows=S.buildings.filter(b=>u.fB==='all'||b.id===u.fB).map(b=>{
    const st=S.stages.filter(s=>(u.fS==='all'||s.id===u.fS)&&lineMatch(c,b,s));if(filtering&&!st.length)return'';
    const open=filtering||u.openB.includes(b.id);
    return `<div class="wb ${open?'open':''}"><div class="wb-row" data-act="tgB" data-b="${b.id}"><span class="wt">${ic('bldg')}</span><div style="min-width:0"><div class="wb-n">${esc(b.name)}</div><div class="wb-s">${pc(b.share,0)} of contract · ${S.stages.length} billing stages</div></div><div class="wb-bar" data-live="bBar" data-b="${b.id}"></div><div class="wb-a"><b data-live="bAmt" data-b="${b.id}"></b><span>This claim</span></div><span class="chev">${ic('chevD')}</span></div>
      ${open?`<div class="wb-in">${st.map(s=>stageRow(c,b,s,ro)).join('')}</div>`:''}</div>`}).join('');
  return `<div class="stack">
    ${ro?`<div class="note ok">${ic('check')}<div>Claim ${cno(c.no)} was invoiced as <b>${inv?invNo(inv):''}</b> on ${fDate(inv?.date)}. Amounts are frozen; to change them, revise the invoice (the old version stays in History).</div></div>`:''}
    <div class="toolrow">${ofSel('Claim','claim',claimOpts,c.no,'data-num="1"')}${hasDraft?'':`<button class="btn" data-act="newclaim">${ic('plus')}New claim</button>`}<span class="sp"></span><div class="row" data-live="claimActs"></div></div>
    <div class="kgrid" data-live="claimKpis"></div>
    <div class="filters">${ofSel('Building','fB',[['all','All'],...S.buildings.map(b=>[b.id,b.name])],u.fB)}${ofSel('Billing stage','fS',[['all','All'],...S.stages.map(s=>[s.id,s.name])],u.fS)}${ofSel('Show','fShow',[['all','All lines'],['claimed','Has progress this claim'],['sug','Site records waiting'],['open','Not complete yet']],u.fShow)}<span class="sp"></span><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="expandAll">Expand all</button><button class="btn sm" data-act="collapseAll">Collapse all</button></div></div>
    <div class="split"><div class="card">${tileHead('hier','Building and stage workbench','Expand a building and a stage, then enter only this month’s progress — earlier claims carry forward.',`<span class="chip pri">${S.buildings.length} physical buildings · ${S.buildings.length*S.stages.length} billing stages</span>`)}
      ${rows||emptyState('hier','No lines match the filters','',`<button class="btn" data-act="clearF">Clear filters</button>`)}</div>
      <div class="sticky"><div class="card ld" data-live="claimSide"></div></div></div>
  </div>`;
};
function stageRow(c,b,s,ro){
  const key=b.id+'|'+s.id;const open=S.ui.openS.includes(key);
  const sug=ro?0:suggestionsFor(c).filter(e=>e.b===b.id&&e.s===s.id).length;
  return `<div class="wbs ${open?'open':''}"><div class="wb-row st" data-act="tgS" data-k="${key}"><span class="sn">${S.stages.indexOf(s)+1}</span>
    <div style="min-width:0"><div class="wb-n sm">${esc(s.name)}${sug?`<span class="chip vio" title="Site records not claimed yet">${ic('truck')}${sug}</span>`:''}</div><div class="wb-s">${pc(s.pct,0)} of contract · ${s.mode==='lump'?'% complete':`${stageItems(s).length} items`} · ${aed(stageVal(b,s),0)}</div></div>
    <div class="wb-bar" data-live="sBar" data-b="${b.id}" data-s="${s.id}"></div>
    <div class="wb-a"><b data-live="bldAmt" data-b="${b.id}" data-s="${s.id}"></b><span>This claim</span></div><span class="chev">${ic('chevD')}</span></div>
    ${open?`<div class="wb-ed">${s.mode==='lump'?lumpEditor(c,b,s,ro):itemsGrid(c,b,s,ro)}</div>`:''}</div>`;
}
function lumpEditor(c,b,s,ro){
  const v=readP(c,b.id,s.id);const prev=prevLump(c,b.id,s.id);
  return `${ro?'':`<div class="toolbar"><span class="small muted" style="flex:1">${esc(b.name)} · lump-sum stage — enter the % of the stage completed this month</span><button class="btn sm" data-act="lumpAll" data-b="${b.id}" data-s="${s.id}">${ic('copy','sm')}Copy to all buildings</button></div>`}
  <div class="tw boxed"><table><colgroup><col><col style="width:120px"><col style="width:170px"><col style="width:120px"><col style="width:150px"></colgroup>
  <thead><tr><th class="n">Stage value</th><th class="n">Done before</th><th class="n">This claim %</th><th class="n">Total done</th><th class="n">This claim (AED)</th></tr></thead><tbody>
  <tr><td class="n">${fmt(stageVal(b,s))}</td><td class="n">${pc(prev)}</td>
  <td><div class="qtycell"><input class="in qty" type="number" step="any" min="0" data-cin="lump" data-b="${b.id}" data-s="${s.id}" value="${v||''}" placeholder="0" ${ro?'disabled':''}><button class="btn sm ${ro||prev>=100-EPS?'hide':''}" data-act="fillLump" data-b="${b.id}" data-s="${s.id}" title="Claim the remaining %">Max</button></div></td>
  <td class="n" data-live="lumpTot" data-b="${b.id}" data-s="${s.id}"></td><td class="n b" data-live="lumpAmt" data-b="${b.id}" data-s="${s.id}"></td></tr></tbody></table></div>
  <div class="how">Amount = <code>stage value × % this claim</code>. “Max” fills whatever is left to 100%.</div>`;
}
function itemsGrid(c,b,s,ro){
  const items=stageItems(s);const sug=suggestionsFor(c).filter(e=>e.s===s.id&&e.b===b.id);
  if(!items.length)return emptyState('list','No items for this stage','Add them in Contract → item breakdown.',`<button class="btn sm" data-act="tab" data-tab="setup">Open Contract</button>`);

LIVE.bAmt=el=>{const c=curClaim();if(!c)return'';const a=S.stages.reduce((t,s)=>t+nowBS(c,el.dataset.b,s.id),0);return a>EPS?aed(a):'—'};
LIVE.claimKpis=()=>{const c=curClaim();if(!c)return'';const a=claimAmounts(c);const vat=a.gross*VAT();const ro=c.status==='invoiced';
  const before=S.claims.filter(x=>x.no<c.no).reduce((t,x)=>t+claimAmounts(x).gross,0);const sug=ro?0:suggestionsFor(c).length;
  const st=ro?['Invoiced','ok','check']:c.status==='checked'?['Checked','pri','shield']:['Draft','warn','edit'];
  return kpi('chart','pri','This claim',aed(a.gross),'Excluding VAT')+
    kpi('receipt','ok','Net payable',aed(a.gross+vat),`Including VAT ${S.project.vat}%`)+
    kpi('spark','pri','Contract invoiced',`${pc(CV()?before/CV()*100:0)} → ${pc(CV()?(before+a.gross)/CV()*100:0)}`,'Before → after this claim')+
    kpi('truck','vio','Site records',ro?'—':String(sug),ro?'Claim is invoiced':sug?'Deliveries / reports not yet claimed':'Nothing waiting',sug?'vio':'')+
    kpi(st[2],st[1],'Claim status',st[0],c.checkedBy?`Checked by ${esc(c.checkedBy)}`:`Prepared by ${esc(c.preparedBy||'—')}`)};
LIVE.claimActs=()=>{const c=curClaim();if(!c)return'';const a=claimAmounts(c);const inv=invByClaim(c.no);const ro=c.status==='invoiced';const dis=a.gross<EPS?'disabled':'';

LIVE.itemAmt=el=>{const c=curClaim();const s=stageById(el.dataset.s);const it=stageItems(s).find(i=>i.id===el.dataset.i);const q=Number(readP(c,el.dataset.b,s.id)[it.id])||0;const a=it.qty?itemVal(it)*q/it.qty:0;return a>EPS?fmt(a):'<span class="muted">—</span>'};

    ${S.claims.length===c.no&&!inv?`<button class="btn ghost danger sm block" data-act="delClaim">Delete this draft</button>`:''}`}</div>`;

  splitEq:()=>{const n=S.buildings.length;if(!n)return;const each=Math.floor(10000/n)/100;S.buildings.forEach((b,i)=>b.share=i===n-1?r2(100-each*(n-1)):each);log('contract','Building shares split equally',S.buildings.map(b=>`${b.name} ${b.share}%`).join(' · '));save();render()},
  addBld:()=>{S.buildings.push({id:uid('B'),name:'Building '+(S.buildings.length+1),share:0});log('contract','Building added');save();render()},
  delBld:(d)=>{const b=S.buildings[+d.i];const used=S.claims.some(c=>c.progress[b.id]&&Object.keys(c.progress[b.id]).length);if(!confirm(used?`${b.name} has claimed progress. Remove it anyway? (Issued invoices are not affected.)`:`Remove ${b.name}?`))return;S.buildings.splice(+d.i,1);log('contract',`Building ${b.name} removed`);save();render()},
  stdStages:()=>{const std=[['Cooling Load Design',10,'lump'],['Material Supply',50,'items'],['Progress Installation',30,'items'],['Commissioning & Handover',5,'lump'],['Energizing Substation',5,'lump']];const ids=['design','material','install','tc','energize'];S.stages=std.map((x,i)=>({id:ids[i],name:x[0],pct:x[1],mode:x[2]}));ids.forEach(i=>S.items[i]=S.items[i]||[]);log('contract','Stages set to Yorks standard 10/50/30/5/5');save();render()},
  addStage:()=>{S.stages.push({id:uid('s'),name:'New stage',pct:0,mode:'lump'});log('contract','Stage added');save();render()},
  delStage:(d)=>{const s=S.stages[+d.i];if(!confirm(`Remove stage “${s.name}”? Issued invoices keep their amounts.`))return;S.stages.splice(+d.i,1);if(S.ui.stage===s.id)S.ui.stage=S.stages[0]?.id;log('contract',`Stage “${s.name}” removed`);save();render()},
  addItem:(d)=>{stageItems(stageById(d.s)).push({id:uid('it'),name:'New item',qty:1,unit:'Nos',w:0});save();render()},

  copyItems:(d)=>{const others=S.stages.filter(s=>s.mode==='items'&&s.id!==d.s&&stageItems(s).length);if(!others.length)return toast('No other item list to copy from');
    openModal({title:'Copy item list',body:`<p style="margin-top:0">Copy item names, quantities and units into <b>${esc(stageById(d.s).name)}</b>. Weights start at 0 so you can enter this stage's weights.</p><div class="field"><label>Copy from</label><select class="in" id="cpFrom">${others.map(s=>`<option value="${s.id}">${esc(s.name)} (${stageItems(s).length} items)</option>`).join('')}</select></div>`,foot:`<button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="doCopyItems" data-s="${d.s}">Copy</button>`})},
  doCopyItems:(d)=>{const from=stageItems(stageById(mval('cpFrom')));S.items[d.s]=from.map(it=>({id:uid('it'),name:it.name,qty:it.qty,unit:it.unit,w:0}));log('contract',`Item list copied into ${stageById(d.s).name}`);closeModal();save();render()},
  addVO:()=>{S.variations.push({no:'VO-'+pad2(S.variations.length+1),desc:'',amount:0,status:'Pending'});save();render()},
  delVO:(d)=>{S.variations.splice(+d.i,1);save();render()},
  newclaim:()=>{if(S.claims.some(c=>c.status!=='invoiced')){toast('Finish or issue the current draft claim first');S.tab='claims';render();return}

  pickClaim:(d)=>{S.ui.claim=+d.no;save();render()},

  fillItem:(d)=>{const c=curClaim(),s=stageById(d.s||S.ui.stage),b=d.b||S.ui.bld;const it=stageItems(s).find(i=>i.id===d.i);const p={...readP(c,b,s.id)};p[it.id]=Math.max(0,r2(it.qty-prevQty(c,b,s.id,it.id)));writeP(c,b,s.id,p);setClaimStatusDirty(c);save();render()},
  fillLump:(d)=>{const c=curClaim(),s=stageById(d.s||S.ui.stage);writeP(c,d.b,s.id,Math.max(0,r2(100-prevLump(c,d.b,s.id))));setClaimStatusDirty(c);save();render()},
  useSug:(d)=>{const e=S.evidence.find(x=>x.id===d.e);applySug(e);save();render();toast(`Used ${e.ref}`)},

  copyBld:(d)=>{const c=curClaim();const src=readP(c,d.b,d.s);if(!confirm(`Copy ${bldById(d.b).name} quantities for ${stageById(d.s).name} to all other buildings? Their current entries will be replaced.`))return;S.buildings.forEach(b=>{if(b.id!==d.b)writeP(c,b.id,d.s,{...src})});setClaimStatusDirty(c);save();render();toast('Copied to all buildings')},
  clearBld:(d)=>{const c=curClaim();writeP(c,d.b,d.s,{});setClaimStatusDirty(c);save();render()},
  checkClaim:()=>{const c=curClaim();c.status='checked';c.checkedBy=curUser().name;log('claim',`Claim ${cno(c.no)} checked`,`Gross ${aed(computeClaim(c).gross)}`);save();render();toast('Marked as checked')},

  previewInv:()=>{const c=curClaim();const no=draftInvNo(c);showInvoice(`Preview — ${no} <span class="chip warn">Draft</span>`,invoiceDoc({no,date:todayIso,submitted:todayIso,claimNo:c.no,amounts:computeClaim(c),draft:true}),`<button class="btn" data-act="print">${ic('print','sm')}Print</button><span class="sp"></span><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="issueInv">Issue invoice</button>`)},
  issueInv:()=>{const c=curClaim();const a=computeClaim(c);if(a.gross<EPS)return;const inv=invByClaim(c.no);const no=draftInvNo(c);
    const over=[];S.buildings.forEach(b=>S.stages.forEach(s=>{if(s.mode==='lump'){if(prevLump(c,b.id,s.id)+readP(c,b.id,s.id)>100+EPS)over.push(`${b.name} ${s.name}`)}else stageItems(s).forEach(it=>{if(prevQty(c,b.id,s.id,it.id)+(Number(readP(c,b.id,s.id)[it.id])||0)>it.qty+EPS)over.push(`${b.name} · ${it.name}`)})}));

        <div class="field"><label>Invoice no.</label><input class="in" id="iNo" value="${no}"></div>

  doIssue:()=>{const c=curClaim();const a=computeClaim(c);const no=mval('iNo').trim(),date=mval('iDate'),sub=mval('iSub'),con=mval('iCon');let inv=invByClaim(c.no);

  savePay:(d)=>{const inv=S.invoices.find(i=>i.id===d.id);const t=mval('pType');const amt=Number(mval('pAmt'))||0;if(amt<=0)return toast('Enter an amount');

/* CSV exports */
function dl(name,rows){const csv=rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Downloaded '+name)}
function exportInvCSV(){dl(`${S.project.code}-invoice-tracker.csv`,[['Invoice','Claim','Submitted','Amount excl VAT','VAT','Total','Certified date','Certified amount','Due date','Received','Cheques in hand','Balance','Status','Delay days'],...S.invoices.map(inv=>{const x=invCalc(inv);return [invNo(inv),inv.claimNo,inv.submitted,x.gross,x.vat,x.total,inv.cert?.date||'',inv.cert?r2(inv.cert.amount):'',x.due,r2(x.received),r2(x.inHand),x.balance,x.st,x.delay]})])}
function exportSummaryCSV(){const inv=invoicedBS();const rows=[['Building','Stage','Stage value','Invoiced to date','% invoiced']];S.buildings.forEach(b=>S.stages.forEach(s=>{const sv=stageVal(b,s);rows.push([b.name,s.name,r2(sv),r2(inv[b.id][s.id]),sv?r2(inv[b.id][s.id]/sv*100):0])}));dl(`${S.project.code}-accounts-summary.csv`,rows)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const mm=document.getElementById('meMenu');if(!mm.hidden&&!e.target.closest('#meMenu')&&!e.target.closest('.me'))mm.hidden=true;
  if(S.ui.side&&window.innerWidth<=1050&&!e.target.closest('.side')&&!e.target.closest('[data-act="side"]')){S.ui.side=false;renderHeader()}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  const a=el.dataset.act;if(a==='ovclose'&&e.target!==el)return;
  const fn=ACT[a];if(fn)fn(el.dataset,e);
});
document.addEventListener('focusin',e=>{const el=e.target;if(el.dataset&&el.dataset.bind)el.dataset.old=el.value});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.uiq){S.ui[el.dataset.uiq]=el.value;save();softRefresh();return}
  if(el.dataset.bind){setPath(el.dataset.bind,el.value,el);if(el.dataset.full){save();render();return}save();softRefresh();return}
  if(el.dataset.cin){const c=curClaim();if(!c||c.status==='invoiced')return;const v=el.value===''?0:Number(el.value);
    if(el.dataset.cin==='lump'){writeP(c,el.dataset.b,el.dataset.s,v);el.classList.toggle('err',prevLump(c,el.dataset.b,el.dataset.s)+v>100+EPS)}
    else{const p={...readP(c,el.dataset.b,el.dataset.s)};p[el.dataset.i]=v;writeP(c,el.dataset.b,el.dataset.s,p);const it=stageItems(stageById(el.dataset.s)).find(i=>i.id===el.dataset.i);el.classList.toggle('err',prevQty(c,el.dataset.b,el.dataset.s,it.id)+v>it.qty+EPS)}
    if(c.status==='checked')setClaimStatusDirty(c);save();softRefresh()}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='actingAs'){S.user=+el.value;save();renderHeader();toast(`Now acting as ${curUser().name}`);return}
  if(el.dataset.ui){S.ui[el.dataset.ui]=el.dataset.num?+el.value:el.value;save();render();return}
  if(el.dataset.bind&&el.dataset.old!==undefined&&el.dataset.old!==el.value){const label=(el.closest('.field')?.querySelector('label')||el.closest('.of')?.querySelector('.ofl'))?.textContent||el.dataset.bind;log('contract',`${label.replace(/\s*\(.*\)/,'')} changed`,`${el.dataset.old||'—'} → ${el.value||'—'}`);el.dataset.old=el.value;save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('meMenu').hidden=true}
  if(e.key==='Enter'&&e.target.dataset?.cin){const all=[...document.querySelectorAll('input[data-cin]:not([disabled])')];const i=all.indexOf(e.target);if(all[i+1]){e.preventDefault();all[i+1].focus();all[i+1].select()}}});
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');document.getElementById('printRoot').innerHTML=''});

renderShell();
load();S.ui=S.ui||{};render();
</script>
</body>
</html>
