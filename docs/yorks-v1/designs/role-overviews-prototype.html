<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yorks Role Overviews</title>
<!--
  Yorks AC. & Ref. — role-based Overview prototype (8 November 2026).
  One home screen per exact role, built from the live Yorks shell, tokens and
  card patterns. Sample data only; YRA-322 Accounts figures follow the signed
  invoices. Switch role with the bar at the top, the account stamp, keys 1–9
  or the ← → arrows. "Role notes" explains who each role is and which cards
  need new server data.
-->
<style>
:root{
  --bg:#EEF3F8;--mbg:#F3F6FA;--chrome:#F9FBFD;--card:#fff;
  --line:#E0E6ED;--line2:#EDF1F6;--lineS:#C8D2DF;--cardb:#D8E2EE;
  --ink:#132033;--ink2:#34435A;--mut:#6B788C;--mut2:#8F9AAE;--navy:#0D2F57;--navyH:#123F73;
  --pri:#1D68D9;--pri-d:#1757B8;--pri-50:#EAF2FF;--pri-100:#C9DCFF;
  --ok:#0D8B63;--ok-50:#E9F8F2;--okI:#2E9A63;
  --warn:#AD6A00;--warn-50:#FFF5DF;--org:#D2742C;
  --bad:#C23737;--bad-50:#FFF0F0;
  --vio:#6D4BD1;--vio-50:#F2EDFF;
  --neu:#F1F4F7;--neuT:#536175;
  --r:14px;--gap:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== prototype bar (not part of the app) ===== */
#pbar{position:sticky;top:0;z-index:80;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(13,47,87,.25)}
.pb-in{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.pb-tag{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;white-space:nowrap;margin-right:4px}
.pb-tag small{font-weight:500;opacity:.7}
.pb-roles{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:0}
.pr{height:30px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:0 10px;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pr:hover{background:rgba(255,255,255,.14)}
.pr.on{background:#fff;color:var(--navy);border-color:#fff}
.pr-n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16)}
.pr.on .pr-n{background:var(--pri-50);color:var(--pri)}
.pb-sel{display:none;flex:1;min-width:160px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font-weight:600}
.pb-sel option{color:var(--ink)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:2px;gap:2px}
.seg button{height:28px;border:0;background:none;color:#fff;border-radius:8px;padding:0 10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy)}
.seg svg.i{width:15px;height:15px}
.pb-btn{height:32px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:9px;padding:0 12px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pb-btn.on{background:#fff;color:var(--navy)}
.pb-btn svg.i{width:15px;height:15px}

/* ===== shell (same as live Yorks web) ===== */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:calc(100vh - var(--pb,48px))}
.app.open{grid-template-columns:246px minmax(0,1fr)}
.side{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:var(--pb,48px);height:calc(100vh - var(--pb,48px));z-index:30;overflow:hidden}
.brand{height:68px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
.brand img{width:36px;height:36px;border-radius:50%;box-shadow:0 1px 4px rgba(19,32,51,.22);flex:none}
.brand .bt{display:none;min-width:0}
.brand .bt b{display:block;font-size:14px;white-space:nowrap}.brand .bt span{display:block;font-size:11px;color:var(--mut);line-height:1.3}
.app.open .brand .bt{display:block}
.side nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 6px;scrollbar-width:thin}
.side h6{display:none;margin:14px 16px 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:700;white-space:nowrap;text-transform:uppercase}
.side h6:first-child{margin-top:4px}
.app.open .side h6{display:block}
.nav{display:flex;align-items:center;gap:14px;height:41px;padding:0 0 0 26px;border-radius:10px;color:var(--ink2);cursor:pointer;margin-bottom:1px;white-space:nowrap;font-size:13px;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav svg.i{width:20px;height:20px}
.nav span{display:none}.app.open .nav span{display:inline}
.nav small{display:none;margin-left:auto;margin-right:10px;font-size:10px;font-weight:700;color:var(--mut);background:var(--neu);border-radius:5px;padding:1px 6px}
.app.open .nav small{display:inline}
.nav:hover{background:#EEF3F9}.nav.on{background:var(--pri-50);color:var(--pri);font-weight:700}
.me{margin:8px 6px 6px;border:1px solid var(--line);border-radius:12px;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;flex:none;width:calc(100% - 12px)}
.me:hover{border-color:var(--lineS)}
.app.open .me{justify-content:flex-start;padding:0 10px}
.me .mt{display:none;min-width:0;flex:1;text-align:left}.app.open .me .mt{display:block}
.me .mt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me .mt span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .chev{display:none;color:var(--mut)}.app.open .me .chev{display:block}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri-50);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:12px;flex:none;position:relative}
.av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#2DA66E;border:2px solid #fff}
.sfoot{display:none;padding:2px 18px 12px;font-size:10.5px;color:var(--mut);line-height:1.4}
.sfoot b{display:flex;gap:5px;align-items:center;color:var(--ink2);font-size:11px}.sfoot b svg{color:#2DA66E;width:14px;height:14px}
.app.open .sfoot{display:block}
#meMenu{position:fixed;left:12px;bottom:76px;width:270px;background:#fff;border:1px solid var(--cardb);border-radius:14px;box-shadow:0 12px 36px rgba(19,32,51,.18);padding:8px;z-index:60;max-height:70vh;overflow:auto}
#meMenu h6{margin:6px 8px 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase}
.mm{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px;border-radius:10px;text-align:left}
.mm:hover{background:var(--bg)}.mm.on{background:var(--pri-50)}
.mm b{display:block;font-size:12.5px}.mm small{display:block;font-size:11px;color:var(--mut)}
main{min-width:0}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 20px 0 22px;border-bottom:1px solid var(--line);background:var(--chrome);position:sticky;top:var(--pb,48px);z-index:20}
.tbi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);border:0;background:none;flex:none;position:relative}
.tbi:hover{background:#EEF3F9}.tbi.dim{color:var(--mut2)}
.tbi svg.i{width:20px;height:20px}
.crumb{margin-left:14px;color:var(--mut);white-space:nowrap;font-size:13px}.crumb b{color:var(--ink);font-weight:700}
.search{margin-left:auto;margin-right:10px;width:300px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;color:var(--mut);font-size:13px}
.kbd{margin-left:auto;background:var(--neu);color:var(--neuT);font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--chrome);line-height:1}
.conn{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;font-weight:600;margin-left:8px;white-space:nowrap}.conn svg{color:#2DA66E}
.wrap{padding:22px 24px 56px;min-width:0;max-width:1480px}

/* ===== page header (live Overview pattern) ===== */
.ph{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.ph-t{flex:1;min-width:0}
.eb{font-size:12px;font-weight:700;color:var(--mut)}
.ph h1{margin:2px 0 4px;font-size:28px;line-height:1.2;font-weight:700;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rchip{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-50);border:1px solid var(--pri-100);border-radius:6px;padding:2px 8px;letter-spacing:0;line-height:1.5}
.ph p{margin:0;color:var(--ink2);font-size:13px;max-width:760px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.meta .dotsep{width:3px;height:3px;border-radius:50%;background:var(--mut2)}
.ph-a{display:flex;gap:10px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}

/* ===== primitives ===== */
.card{background:var(--card);border:1px solid var(--cardb);border-radius:var(--r);min-width:0}
.stack{display:grid;gap:var(--gap);min-width:0;align-content:start}
.sp{flex:1}
.ch{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.ch .ci{color:var(--pri);flex:none;margin-top:1px;display:flex}
.ch .ci svg.i{width:21px;height:21px}
.cht{min-width:0;flex:1}
.ch h3{margin:0;font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3}
.ch p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.ch .ca{display:flex;gap:8px;align-items:center;flex:none;margin-left:auto}
.ti{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.ti svg.i{width:20px;height:20px}
.t-blue{background:#EAF1FB;color:var(--pri)}.t-green{background:#E9F6F0;color:var(--okI)}.t-vio{background:#F1EEFB;color:var(--vio)}.t-org{background:#FBF1E8;color:var(--org)}.t-red{background:#FCEDED;color:var(--bad)}.t-neu{background:var(--neu);color:var(--neuT)}.t-gold{background:#FFF5DF;color:var(--warn)}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;height:38px;font-weight:700;color:var(--ink2);white-space:nowrap;font-size:13px}
.btn svg.i{width:17px;height:17px}
.btn:hover{background:#F3F7FC;border-color:var(--lineS)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:999px;padding:0 18px}.btn.navy:hover{background:var(--navyH)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;border-radius:999px}.btn.pri:hover{background:var(--pri-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri);padding:0 8px}.btn.ghost:hover{background:var(--pri-50)}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;gap:6px}.btn.sm svg.i{width:15px;height:15px}
.btn.pri.sm{border-radius:999px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--neu);color:var(--neuT);vertical-align:middle}
.chip svg.i{width:12px;height:12px}
.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.warn{background:var(--warn-50);color:var(--warn)}.chip.bad{background:var(--bad-50);color:var(--bad)}.chip.pri{background:var(--pri-50);color:var(--pri)}.chip.vio{background:var(--vio-50);color:var(--vio)}
.muted{color:var(--mut)}.b{font-weight:700}
.note{display:flex;gap:10px;align-items:center;background:#FFF8EA;border:1px solid #F6E2B8;border-left:3px solid #E0A33A;border-radius:8px;padding:10px 14px;color:var(--ink2);font-size:12.5px;margin-bottom:var(--gap)}
.note>svg.i{color:var(--warn)}

/* KPI tiles — live Overview tile + caption */
.kgrid{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--kc,5),minmax(0,1fr));margin-bottom:var(--gap)}
.fullw{margin-bottom:var(--gap)}
.fullw td:first-child{min-width:240px}
.kt{background:#fff;border:1px solid var(--cardb);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:122px;text-align:left;min-width:0}
.kt:hover{border-color:var(--lineS);box-shadow:0 2px 10px rgba(19,32,51,.06)}
.kt.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.kh{display:flex;gap:10px;align-items:center;min-height:34px}
.kt .ti{width:34px;height:34px;border-radius:9px}.kt .ti svg.i{width:18px;height:18px}
.kl{font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.3}
.kv{font-size:26px;font-weight:700;color:var(--ink);line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv.money{font-size:19px;margin-top:12px}
.kv small{font-size:14px;color:var(--mut);font-weight:600}
.kv.bad{color:var(--bad)}.kv.warn{color:var(--warn)}.kv.ok{color:var(--ok)}
.ks{font-size:12px;color:var(--mut);line-height:1.35}

/* two-column body */
.cols{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.full{margin-top:var(--gap)}

/* work queue */
.qtabs{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.qt{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.qt b{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.qt:hover{border-color:var(--lineS)}
.qt.on{background:var(--pri-50);border-color:var(--pri-100);color:var(--pri)}.qt.on b{color:var(--pri)}
.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) 64px auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.qrow:hover{background:#F8FBFF}
.qrow .ti{width:40px;height:40px;border-radius:10px}.qrow .ti svg.i{width:19px;height:19px}
.qb{min-width:0}
.q1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.q1 b{font-size:13.5px;color:var(--ink)}
.qref{font-size:11.5px;font-weight:700;color:var(--pri);white-space:nowrap}
.qm{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qby{font-size:11.5px;color:var(--mut);margin-top:2px}
.qq{font-size:12px;color:var(--ink2);margin-top:4px;background:var(--bg);border-left:3px solid var(--org);border-radius:4px;padding:5px 9px;font-style:italic}
.age{text-align:right;line-height:1.2}
.age b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.age span{font-size:10.5px;color:var(--mut)}
.age.warn b{color:var(--warn)}.age.bad b{color:var(--bad)}
.qmore{width:100%;border:0;border-top:1px solid var(--line2);background:#FAFCFE;height:40px;font-weight:700;color:var(--pri);font-size:12.5px}
.qmore:hover{background:var(--pri-50)}
.qfoot{padding:10px 18px 12px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.qfoot svg.i{width:14px;height:14px;margin-top:1px;flex:none}
.clear{display:flex;gap:14px;align-items:center;padding:18px;border-top:1px solid var(--line2)}
.clear b{display:block;font-size:14px}.clear span{font-size:12.5px;color:var(--ink2)}

/* lists */
.li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line2);cursor:pointer}
.li:hover{background:#F8FBFF}
.li .ti{width:36px;height:36px;border-radius:10px}.li .ti svg.i{width:17px;height:17px}
.lt{font-weight:700;font-size:13px;color:var(--ink)}
.ld{font-size:12px;color:var(--ink2);margin-top:1px}
.lr{text-align:right;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.lr small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.lr.bad{color:var(--bad)}.lr.warn{color:var(--warn)}.lr.ok{color:var(--ok)}.lr.vio{color:var(--vio)}
.cbody{padding:0 0 6px}

/* stage bars */
.pv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 48px;gap:12px;align-items:center;padding:7px 18px;cursor:pointer}
.pv:hover{background:#F8FBFF}
.pl{font-size:12.5px;color:var(--ink2);font-weight:600;line-height:1.3}
.pl small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.pbw{height:10px;border-radius:6px;background:#E6ECF3;overflow:hidden}
.pbw i{display:block;height:100%;border-radius:6px}
.pn{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pfoot{padding:8px 18px 14px;font-size:11.5px;color:var(--mut)}

/* money */
.kvr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 18px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2)}
.kvr b{font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.kvr small{display:block;font-size:11px;color:var(--mut)}
.kvr b.bad{color:var(--bad)}.kvr b.ok{color:var(--ok)}.kvr b.vio{color:var(--vio)}.kvr b.pri{color:var(--pri)}
.mbar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:#E6ECF3;margin:4px 18px 8px}
.mbar i{display:block;height:100%}
.mleg{display:flex;gap:14px;flex-wrap:wrap;padding:0 18px 12px;font-size:11.5px;color:var(--ink2)}
.mleg span{display:inline-flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* bars */
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:end;height:170px;padding:8px 18px 14px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bc b{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bw{width:100%;max-width:44px;flex:1;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:3px}
.bc small{font-size:11px;color:var(--mut)}

/* request tracker */
.tr{padding:11px 18px;border-top:1px solid var(--line2);cursor:pointer}
.tr:hover{background:#F8FBFF}
.tr-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tr-h b{font-size:13px}
.tr-h .age{margin-left:auto}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 6px}
.steps i{height:6px;border-radius:4px;background:#E3E9F1;display:block}
.steps i.d{background:#9DBDEB}.steps i.c{background:var(--pri)}
.steps.warn i.c{background:var(--org)}
.tr-s{font-size:12px;color:var(--ink2)}
.tr-s b{color:var(--ink)}
.tr-s .warn{color:var(--warn);font-weight:700}.tr-s .bad{color:var(--bad);font-weight:700}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 18px 16px}
.tool{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:left;min-height:56px}
.tool:hover{border-color:var(--lineS);background:#F8FBFF}
.tool .ti{width:36px;height:36px;border-radius:10px}
.tool b{display:block;font-size:12.5px}.tool small{display:block;font-size:11px;color:var(--mut)}

/* tables */
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#F7F9FC;color:var(--mut);font-weight:700;font-size:10.5px;text-align:left;padding:9px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{padding-left:18px}th:last-child,td:last-child{padding-right:18px}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;height:48px}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FBFF}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{background:#F7F9FC;font-weight:700;border-top:1px solid var(--line);height:42px}
.cell-t b{display:block;font-size:12.5px;color:var(--ink)}.cell-t span{display:block;font-size:11.5px;color:var(--mut)}
.z{color:var(--mut2)}
.bad-t{color:var(--bad);font-weight:700}.warn-t{color:var(--warn);font-weight:700}.ok-t{color:var(--ok);font-weight:700}

/* role notes */
.rn{margin-bottom:var(--gap);border-color:#DCD3F7;background:linear-gradient(180deg,#FBFAFF 0,#fff 60%)}
.rn-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 8px}
.rn-h .ti{width:38px;height:38px;border-radius:10px}
.rn-h h3{margin:0;font-size:15px}
.rn-h p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.rn-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:4px 18px 10px}
.rn-g h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--vio)}
.rn-g ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.rn-g li{margin:2px 0}
.rn-f{border-top:1px solid #ECE7FA;padding:10px 18px 12px;font-size:12.5px;color:var(--ink2);display:grid;gap:4px}
.rn-f b{color:var(--ink)}
.src{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;border:1px dashed currentColor}
.src.live{color:var(--ok)}.src.part{color:var(--warn)}.src.new{color:var(--vio)}

/* skeleton */
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,#E9EEF4 0,#F4F7FA 50%,#E9EEF4 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skrow{display:grid;grid-template-columns:40px 1fr 70px;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line2)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(19,32,51,.3);opacity:0;pointer-events:none;transition:all .18s;z-index:100;max-width:min(560px,92vw)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== phone ===== */
.pwrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px 48px}
.phone{width:390px;height:844px;flex:none;border-radius:46px;background:#fff;border:10px solid #172235;box-shadow:0 24px 60px rgba(19,32,51,.28);overflow:hidden;display:flex;flex-direction:column;position:sticky;top:64px}
.phone.bare{width:100%;height:calc(100vh - var(--pb,48px));border:0;border-radius:0;box-shadow:none;position:relative;top:0}
.m-status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:700;background:#fff}
.phone.bare .m-status{display:none}
.m-head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);background:#fff}
.m-head img{width:30px;height:30px;border-radius:50%}
.m-head b{font-size:17px;flex:1}
.m-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);position:relative}
.m-ic .badge{top:6px;right:6px;border-color:#fff}
.m-body{flex:1;overflow:auto;background:var(--mbg);padding:14px 12px 24px;display:grid;gap:12px;align-content:start}
.m-hi{padding:2px 4px 0}
.m-hi .eb{font-size:12px}
.m-hi h2{margin:2px 0 2px;font-size:20px;line-height:1.25}
.m-hi p{margin:0;font-size:12.5px;color:var(--ink2)}
.m-hi .meta{margin-top:6px}
.m-act{display:grid;gap:8px}
.m-act .btn{height:48px;border-radius:14px;font-size:14px}
.m-act .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-act .row2 .btn{height:44px;font-size:12.5px;padding:0 8px}
.m-k{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-k .kt{min-height:104px;padding:12px;border-radius:14px}
.m-k .kv{font-size:22px;margin-top:4px}.m-k .kv.money{font-size:15px;margin-top:8px}
.m-k .kl{font-size:12px}
.m-body .card{border-radius:16px}
.m-body .ch{padding:14px 14px 8px}
.m-body .ch h3{font-size:15px}
.m-body .qtabs{padding:0 14px 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.m-body .qt{height:36px;flex:none}
.m-body .qrow{grid-template-columns:38px minmax(0,1fr) auto;gap:10px;padding:12px 14px}
.m-body .qrow .age{grid-column:3;grid-row:1}
.m-body .qrow .btn{grid-column:2/4;justify-self:start;height:40px;min-width:120px}
.m-body .li{grid-template-columns:36px minmax(0,1fr) auto;padding:11px 14px}
.m-body .pv{padding:7px 14px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 40px}
.m-body .kvr{padding:8px 14px}
.m-body .tr{padding:12px 14px}
.m-body .tools{padding:0 14px 14px;grid-template-columns:1fr 1fr}
.m-body .qfoot{padding:10px 14px 12px}
.m-body .rn-g{grid-template-columns:1fr;padding:4px 14px 10px}.m-body .rn-h{padding:14px 14px 6px}.m-body .rn-f{padding:10px 14px 12px}.m-body .rn{margin:0}
.m-body .mbar{margin:4px 14px 8px}.m-body .mleg{padding:0 14px 12px}
.mcard{padding:11px 14px;border-top:1px solid var(--line2);cursor:pointer}
.mcard:hover{background:#F8FBFF}
.mc-t{font-size:13px}
.mc-g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:6px}
.mc-g div{min-width:0}
.mc-g span{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.mc-g b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.m-nav{height:76px;flex:none;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px 14px}
.phone.bare .m-nav{position:sticky;bottom:0;padding-bottom:8px;height:64px}
.mn{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);border-radius:12px;position:relative}
.mn svg.i{width:22px;height:22px}
.mn.on{color:var(--pri)}
.mn.on .mni{background:var(--pri-50)}
.mni{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.mn .badge{top:-2px;right:6px;border-color:#fff}
.pnotes{width:420px;flex:none;position:sticky;top:64px}
.pnotes .rn-g{grid-template-columns:1fr}

/* ===== responsive ===== */
@media (max-width:900px){.kgrid{--kc:2!important}}
@media (max-width:1180px){.cols{grid-template-columns:1fr}.rn-g{grid-template-columns:1fr 1fr}.pnotes{display:none}}
@media (max-width:1050px){
  .app,.app.open{grid-template-columns:1fr}.side{display:none}
  .app.open .side{display:flex;position:fixed;left:0;top:var(--pb,48px);width:246px;box-shadow:0 0 40px rgba(19,32,51,.25)}
  .search,.crumb{display:none}.conn{margin-left:auto}
}
@media (max-width:900px){.pb-roles{display:none}.pb-sel{display:block}}
@media (max-width:720px){.seg.dev button span{display:none}.seg button{padding:0 8px}}
</style>

const S={role:'pe',view:'desktop',state:'normal',notes:true,tab:{},more:{},open:true,menu:false,updated:'09:42',sel:null};
try{const h=new URLSearchParams(location.hash.slice(1));if(R[h.get('role')])S.role=h.get('role');if(h.get('view')==='phone')S.view='phone';if(h.get('notes')==='0')S.notes=false;}catch(e){}

const loading=()=>S.state==='loading';
const srcChip=s=>S.notes&&s.src?`<span class="src ${s.src}" title="${s.src==='live'?'Uses an existing protected server projection':s.src==='part'?'Mostly existing data; some figures need a small server extension':'Needs a new protected read projection'}">${s.src==='live'?'Data ready':s.src==='part'?'Partly new data':'Needs new data'}</span>`:'';
const head=(s)=>`<div class="ch">${s.icon?`<span class="ci">${ic(s.icon)}</span>`:''}<div class="cht"><h3>${s.title}</h3>${s.sub?`<p>${s.sub}</p>`:''}</div><div class="ca">${srcChip(s)}${s.link?`<button class="btn ghost sm" data-go="${esc(s.link)}">${s.link}</button>`:''}</div></div>`;
const skel=n=>Array.from({length:n},()=>`<div class="skrow"><span class="sk" style="width:40px;height:40px;border-radius:10px"></span><span><span class="sk" style="height:12px;width:62%"></span><span class="sk" style="height:10px;width:40%;margin-top:7px"></span></span><span class="sk" style="height:12px"></span></div>`).join('');

function kpiTile(k){
  const cleared=S.state==='clear'&&k.act;
  const v=loading()?`<span class="sk" style="height:24px;width:${k.m?80:40}%;margin-top:10px"></span>`:`<div class="kv ${k.m?'money':''} ${cleared?'ok':k.cls||''}">${cleared?(/^\d/.test(k.v)?'0':'Done'):k.v}</div>`;
  const s=loading()?`<span class="sk" style="height:10px;width:70%;margin-top:8px"></span>`:`<div class="ks">${S.state==='clear'&&k.act?'Nothing waiting':k.s}</div>`;
  return `<button class="kt ${S.sel===k.go?'sel':''}" data-kpi="${esc(k.go||'')}" data-label="${esc(k.l)}"><div class="kh"><span class="ti ${TONE[k.t]}">${ic(k.i)}</span><span class="kl">${k.l}</span></div>${v}${s}</button>`;
}

function qrow(x,phone){
  const [icn,tone]=KIND[x.k]||['doc','pri'];
  return `<div class="qrow" data-go="${esc((x.ref||'')+' · '+x.t)}"><span class="ti ${TONE[tone]}">${ic(icn)}</span><div class="qb"><div class="q1"><b>${x.t}</b><span class="qref">${x.ref||''}</span></div><div class="qm">${x.m}${x.tag?` <span class="chip ${x.tag[1]}">${x.tag[0]}</span>`:''}</div>${x.q?`<div class="qq">${x.q}</div>`:''}${x.by?`<div class="qby">${x.by}</div>`:''}</div><div class="age ${x.at||''}"><b>${x.age||''}</b><span>${x.age==='today'?'':'waiting'}</span></div><button class="btn sm ${x.p?'pri':''}" data-go="${esc((x.b||'Open')+' · '+(x.ref||x.t))}">${x.b||'Open'}</button></div>`;
}

function secQueue(s,phone){
  const rows=S.state==='clear'?[]:s.rows;
  const total=S.state==='clear'?0:(s.total||rows.length);
  const key=x=>x.g||x.k;
  const cur=S.tab[s.id]||'all';
  const shown=cur==='all'?rows:rows.filter(x=>key(x)===cur);
  const lim=phone?4:(s.limit||8);
  const all=S.more[s.id];
  const tabs=(s.tabs&&s.tabs.length&&rows.length)?`<div class="qtabs" role="tablist">${s.tabs.map(([k,l])=>{const n=k==='all'?rows.length:rows.filter(x=>key(x)===k).length;return n||k==='all'?`<button class="qt ${cur===k?'on':''}" role="tab" aria-selected="${cur===k}" data-tab="${s.id}:${k}">${l}<b>${n}</b></button>`:''}).join('')}</div>`:'';
  let body;
  if(loading())body=skel(4);
  else if(!shown.length)body=`<div class="clear"><span class="ti t-green">${ic('check')}</span><div><b>${s.clear[0]}</b><span>${s.clear[1]}</span></div></div>`;
  else body=shown.slice(0,all?99:lim).map(x=>qrow(x,phone)).join('')+(shown.length>lim&&!all?`<button class="qmore" data-more="${s.id}">Show all ${shown.length}</button>`:'')+(total>rows.length&&(all||shown.length<=lim)?`<button class="qmore" data-go="All ${total} in Material Requests">Open all ${total} in Material Requests</button>`:'');
  return `<section class="card" id="s-${s.id}">${head({...s,title:s.title+(total&&!loading()?` <span class="chip pri">${total}</span>`:'')})}${tabs}${body}${s.foot&&!loading()?`<div class="qfoot">${ic('info')}<span>${s.foot}</span></div>`:''}</section>`;
}

function secTable(s,phone){
  if(loading())return `<section class="card" id="s-${s.id}">${head(s)}${skel(3)}</section>`;
  const num=s.num||[];
  if(phone){
    const mc=s.mcols||[1,2];
    return `<section class="card" id="s-${s.id}">${head(s)}${s.rows.map(r=>`<div class="mcard" data-go="${esc(strip(r[0]))}"><div class="mc-t">${r[0]}</div><div class="mc-g">${mc.map(i=>`<div><span>${s.cols[i]}</span><b>${r[i]}</b></div>`).join('')}</div></div>`).join('')}</section>`;
  }
  return `<section class="card" id="s-${s.id}">${head(s)}<div class="tw"><table><thead><tr>${s.cols.map((c,i)=>`<th class="${num.includes(i)?'n':''}">${c}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr class="click" data-go="${esc(strip(r[0]))}">${r.map((c,i)=>`<td class="${num.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>${s.foot?`<tfoot><tr>${s.foot.map((c,i)=>`<td class="${num.includes(i)?'n':''}">${c}</td>`).join('')}</tr></tfoot>`:''}</table></div></section>`;
}

function secPipe(s){
  if(loading())return `<section class="card" id="s-${s.id}">${head(s)}${skel(3)}</section>`;
  const max=Math.max(...s.stages.map(x=>x[1]),1);
  return `<section class="card" id="s-${s.id}">${head(s)}<div class="cbody">${s.stages.map(x=>`<div class="pv" data-go="${esc(x[0])}"><span class="pl">${x[0]}${x[3]?`<small>${x[3]}</small>`:''}</span><span class="pbw"><i style="width:${Math.max(3,x[1]/max*100)}%;background:${COL[x[2]]}"></i></span><b class="pn">${x[1]}</b></div>`).join('')}</div>${s.foot?`<div class="pfoot">${s.foot}</div>`:''}</section>`;
}

function secList(s){
  if(loading())return `<section class="card" id="s-${s.id}">${head(s)}${skel(3)}</section>`;
  return `<section class="card" id="s-${s.id}">${head(s)}<div class="cbody">${s.items.map(x=>`<div class="li" data-go="${esc(strip(x.h))}"><span class="ti ${TONE[x.t]}">${ic(x.i)}</span><div><div class="lt">${x.h}</div><div class="ld">${x.d}</div></div>${x.r?`<div class="lr ${x.rt||''}">${x.r}</div>`:''}</div>`).join('')}</div></section>`;
}

function secMoney(s){
  if(loading())return `<section class="card" id="s-${s.id}">${head(s)}${skel(2)}</section>`;
  let bar='';
  if(s.bar){const tot=s.bar.reduce((a,b)=>a+Math.max(0,b[1]),0);
    bar=`<div class="mbar">${s.bar.map(b=>`<i style="width:${Math.max(0,b[1])/tot*100}%;background:${COL[b[2]]}" title="${esc(b[0])}"></i>`).join('')}</div><div class="mleg">${s.bar.map(b=>`<span><i class="dot" style="background:${COL[b[2]]}"></i>${b[0]}</span>`).join('')}</div>`;}
  return `<section class="card" id="s-${s.id}">${head(s)}${bar}<div class="cbody">${s.rows.map(r=>`<div class="kvr"><span>${r[0]}${r[3]?`<small>${r[3]}</small>`:''}</span><b class="${r[2]||''}">${r[1]}</b></div>`).join('')}</div></section>`;
}

function secBars(s){
  if(loading())return `<section class="card" id="s-${s.id}">${head(s)}${skel(2)}</section>`;
  const max=Math.max(...s.data.map(d=>d[1]),1);
  return `<section class="card" id="s-${s.id}">${head(s)}<div class="bars">${s.data.map(([l,v])=>`<div class="bc"><b>${v?m2(v):'—'}</b><span class="bw"><i style="height:${v?Math.max(3,v/max*100):0}%"></i></span><small>${l}</small></div>`).join('')}</div></section>`;
}

function secTrack(s){
  if(loading())return `<section class="card" id="s-${s.id}">${head(s)}${skel(3)}</section>`;
  return `<section class="card" id="s-${s.id}">${head(s)}${s.items.map(x=>`<div class="tr" data-go="${esc(x.ref)}"><div class="tr-h"><span class="qref">${x.ref}</span><b>${x.t}</b><span class="age"><b>${x.age}</b></span></div><div class="steps ${x.w?'warn':''}" aria-label="${STAGES[x.s-1]}">${STAGES.map((n,i)=>`<i class="${i+1<x.s?'d':i+1===x.s?'c':''}" title="${n}"></i>`).join('')}</div><div class="tr-s"><b>${STAGES[x.s-1]}</b> · ${x.o}${x.n?` · <span class="${x.nt||''}">${x.n}</span>`:''}</div></div>`).join('')}</section>`;
}

function secTools(s){
  return `<section class="card" id="s-${s.id}">${head(s)}<div class="tools">${s.items.map(([i,l,d])=>`<button class="tool" data-go="${esc(l)}"><span class="ti t-blue">${ic(i)}</span><span><b>${l}</b><small>${d}</small></span></button>`).join('')}</div></section>`;
}

const SEC={queue:secQueue,table:secTable,pipe:secPipe,list:secList,money:secMoney,bars:secBars,track:secTrack,tools:secTools};
const sec=(s,phone)=>SEC[s.type](s,phone);
const allSecs=r=>[...r.top,...r.left,...r.right,...r.full];

function notesCard(r){
  const n=r.notes,li=a=>a.map(x=>`<li>${x}</li>`).join('');
  return `<section class="card rn"><div class="rn-h"><span class="ti t-vio">${ic('book')}</span><div class="cht"><h3>Understanding the ${r.role} role</h3><p>${n.who}</p></div><button class="btn ghost sm" data-act="notes">Hide notes</button></div>
  <div class="rn-g"><div><h5>Responsible for</h5><ul>${li(n.does)}</ul></div><div><h5>Needs from Overview</h5><ul>${li(n.needs)}</ul></div><div><h5>Not their job</h5><ul>${li(n.not)}</ul></div></div>
  <div class="rn-f"><div><b>Today’s screen:</b> ${n.today}</div><div><b>Data:</b> ${n.data}</div></div></section>`;
}

function navHtml(items){
  return items.map(x=>{
    if(x[0]==='h')return `<h6>${x[1]}</h6>`;
    const [i,l,on,suf,b]=x;
    return `<button class="nav ${on?'on':''}" data-go="${esc(l)}" title="${esc(l)}">${ic(i)}<span>${l}</span>${suf?`<small>${suf}</small>`:''}${b?`<small style="background:var(--bad);color:#fff">${b}</small>`:''}</button>`;
  }).join('');
}

function header(r){
  const acts=r.actions.map(([i,l,c])=>`<button class="btn ${c||''}" data-go="${esc(l)}">${ic(i)}${l}</button>`).join('');
  return `<div class="ph"><div class="ph-t"><div class="eb">${r.person}</div><h1>${r.title} <span class="rchip">${r.role}</span></h1><p>${r.desc}</p>
   <div class="meta"><span class="chip pri">${ic('eye')}${r.scope}</span><span class="dotsep"></span><span>${loading()?'Checking with the server…':`Updated ${S.updated} · server-confirmed`}</span><button class="btn ghost sm" data-act="refresh">${ic('refresh')}Refresh</button></div></div>
   <div class="ph-a">${acts}</div></div>`;
}

function deskView(r){
  const k=r.kpis.map(kpiTile).join('');
  return `<div class="app ${S.open?'open':''}">
  <aside class="side"><div class="brand"><img src="${LOGO}" alt="Yorks emblem"><div class="bt"><b>Yorks AC. &amp; Ref.</b><span>Yorks Air Conditioning &amp; Refrigeration LLC-SPC</span></div></div>
   <nav aria-label="Main">${navHtml(r.nav)}</nav>
   <button class="me" data-act="me" aria-haspopup="menu"><span class="av">${r.ini}</span><span class="mt"><b>${r.person}</b><span>${r.role}</span></span><span class="chev">${ic('chevUD','sm')}</span></button>
   <div class="sfoot"><b>${ic('cloud')}Connected</b>Procurement Control &amp; Inventory</div></aside>
  <main><div class="topbar"><button class="tbi" data-act="side" title="Collapse panel">${ic('panel')}</button><button class="tbi dim">${ic('arrowL')}</button><button class="tbi dim">${ic('arrowR')}</button>
   <span class="crumb">Yorks AC. &amp; Ref. <span style="margin:0 6px">/</span><b>${r.crumb}</b></span>
   <div class="search" data-go="Search">${ic('search','sm')}<span>Search or jump to…</span><span class="kbd">⌘K</span></div>
   <button class="tbi" data-go="Full screen">${ic('expand')}</button><button class="tbi" data-go="Team Chat">${ic('msgs')}<span class="badge">3</span></button><button class="tbi" data-go="Notifications">${ic('bell')}<span class="badge">5</span></button><span class="conn">${ic('cloud','sm')}<span>Connected</span></span></div>
   <div class="wrap">${header(r)}${S.notes?notesCard(r):''}${S.state==='partial'?'':''}<div class="kgrid" style="--kc:${r.kpis.length===6?3:r.kpis.length}">${k}</div>
   ${r.top.map(s=>`<div class="fullw">${sec(s)}</div>`).join('')}<div class="cols"><div class="stack">${r.left.map(s=>sec(s)).join('')}</div><div class="stack">${r.right.map(s=>sec(s)).join('')}</div></div>${r.full.map(s=>`<div class="full">${sec(s)}</div>`).join('')}</div></main></div>
  ${S.menu?meMenu(r):''}`;
}

function meMenu(r){
  return `<div id="meMenu" role="menu"><h6>Switch role (prototype)</h6>${ORDER.map((k,i)=>`<button class="mm ${S.role===k?'on':''}" data-role="${k}" role="menuitem"><span class="av" style="width:30px;height:30px">${R[k].ini}</span><span><b>${R[k].person}</b><small>${R[k].role} · key ${i+1}</small></span></button>`).join('')}<h6>Account</h6><button class="mm" data-go="Open My Yorks"><span>${ic('users')}</span><span><b>Open My Yorks</b><small>Profile, access and preferences</small></span></button></div>`;
}

function phoneView(r,bare){
  const first=r.actions[0];
  const rest=r.actions.slice(1,3);
  const ks=(r.mk||[0,1,2,3]).map(i=>kpiTile(r.kpis[i])).join('');
  const greet=r.role==='Admin'?'Good morning':'Good morning, '+r.person.split(' ')[0];
  const body=`<div class="m-hi"><div class="eb">${greet}</div><h2>${r.title} <span class="rchip">${r.role}</span></h2><p>${r.desc}</p><div class="meta"><span>${loading()?'Checking with the server…':`Updated ${S.updated}`}</span><span class="dotsep"></span><span>${r.scope}</span></div></div>
   <div class="m-act"><button class="btn navy block" data-go="${esc(first[1])}">${ic(first[0])}${first[1]}</button>${rest.length?`<div class="row2">${rest.map(([i,l])=>`<button class="btn" data-go="${esc(l)}">${ic(i)}${l}</button>`).join('')}</div>`:''}</div>
   <div class="m-k">${ks}</div>
   ${r.phone.map(id=>{const s=allSecs(r).find(x=>x.id===id);return s?sec(s,true):''}).join('')}`;
  const nav=r.mnav.map(([i,l,on,b])=>`<button class="mn ${on?'on':''}" data-go="${esc(l)}"><span class="mni">${ic(i)}${b?`<span class="badge">${b}</span>`:''}</span>${l}</button>`).join('');
  const ph=`<div class="phone ${bare?'bare':''}"><div class="m-status"><span>9:41</span><span>●●●● ▮</span></div><div class="m-head"><img src="${LOGO}" alt=""><b>${r.title}</b><button class="m-ic" data-go="Notifications" aria-label="Notifications">${ic('bell')}<span class="badge">5</span></button><button class="m-ic" data-act="me" aria-label="Account"><span class="av" style="width:32px;height:32px">${r.ini}</span></button></div><div class="m-body">${bare&&S.notes?notesCard(r):''}${body}</div><nav class="m-nav" aria-label="Main">${nav}</nav></div>`;
  return (bare?ph:`<div class="pwrap">${ph}${S.notes?`<div class="pnotes">${notesCard(r)}</div>`:''}</div>`)+(S.menu?meMenu(r):'');
}

function protoBar(){
  return `<div class="pb-in"><span class="pb-tag" title="Prototype with sample data · keys 1–9 or ← → switch role">${ic('eye')}Role overviews</span>
  <div class="pb-roles" role="tablist" aria-label="Role">${ORDER.map((k,i)=>`<button class="pr ${S.role===k?'on':''}" data-role="${k}" role="tab" aria-selected="${S.role===k}" title="${R[k].role} — key ${i+1}">${R[k].short}</button>`).join('')}</div>
  <select class="pb-sel" data-sel="role" aria-label="Role">${ORDER.map((k,i)=>`<option value="${k}" ${S.role===k?'selected':''}>${i+1}. ${R[k].role}</option>`).join('')}</select>
  <div class="seg dev" role="group" aria-label="Device">${[['desktop','monitor','Desktop'],['phone','phone','Phone']].map(([v,i,l])=>`<button class="${S.view===v?'on':''}" data-view="${v}">${ic(i)}<span>${l}</span></button>`).join('')}</div>
  <div class="seg" role="group" aria-label="State">${[['normal','Normal'],['clear','All clear'],['loading','Loading']].map(([v,l])=>`<button class="${S.state===v?'on':''}" data-state="${v}"><span>${l}</span></button>`).join('')}</div>
  <button class="pb-btn ${S.notes?'on':''}" data-act="notes">${ic('book')}Notes</button></div>`;
}

function render(keepScroll){
  const r=R[S.role];
  const y=window.scrollY;
  const pb=document.getElementById('pbar');
  pb.innerHTML=protoBar();
  document.documentElement.style.setProperty('--pb',pb.offsetHeight+'px');
  const small=matchMedia('(max-width:720px)').matches;
  // On tablet the sidebar is an overlay, so it starts closed there and open on desktop.
  const tablet=innerWidth<=1050;if(tablet!==S.tablet){S.tablet=tablet;S.open=!tablet;}
  const phone=S.view==='phone'||small;
  const stg=document.getElementById('stage');
  stg.innerHTML=phone?phoneView(r,small):deskView(r);
  document.title=`${r.role} · Yorks Role Overviews`;
  const h=`role=${S.role}${S.view==='phone'?'&view=phone':''}${S.notes?'':'&notes=0'}`;
  if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h);
  window.scrollTo(0,keepScroll?y:0);
}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}

function setRole(k){if(!R[k])return;S.role=k;S.tab={};S.more={};S.sel=null;S.menu=false;render();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-role],[data-view],[data-state],[data-act],[data-tab],[data-more],[data-kpi],[data-go]');
  if(!el){if(S.menu){S.menu=false;render(true)}return;}
  const d=el.dataset;
  if(d.role)return setRole(d.role);
  if(d.view){S.view=d.view;S.menu=false;return render();}
  if(d.state){S.state=d.state;return render(true);}
  if(d.act==='notes'){S.notes=!S.notes;return render(true);}
  if(d.act==='side'){S.open=!S.open;return render(true);}
  if(d.act==='me'){S.menu=!S.menu;return render(true);}
  if(d.act==='refresh'){S.state='loading';render(true);setTimeout(()=>{S.state='normal';const n=new Date();S.updated=n.toTimeString().slice(0,5);render(true);toast('Refreshed from the server. Nothing you were looking at moved.');},700);return;}
  if(d.tab){const [id,k]=d.tab.split(':');S.tab[id]=k;S.more[id]=false;return render(true);}
  if(d.more){S.more[d.more]=true;return render(true);}
  if(d.kpi!==undefined){
    const go=d.kpi;const r=R[S.role];
    if(!go)return toast(`${d.label}: opens the filtered register.`);
    S.sel=S.sel===go?null:go;
    if(go.startsWith('@')){render(true);const t=document.getElementById('s-'+go.slice(1));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}
    const q=allSecs(r).find(s=>s.type==='queue'&&s.rows.some(x=>(x.g||x.k)===go));
    if(q){S.tab[q.id]=S.sel?go:'all';S.more[q.id]=false;render(true);const t=document.getElementById('s-'+q.id);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});}
    else render(true);
    return;
  }
  if(d.go){e.stopPropagation();if(S.menu){S.menu=false;render(true);}return toast(`Prototype: opens “${d.go}”. The real screen re-checks access when it opens.`);}
});
document.addEventListener('change',e=>{if(e.target.dataset.sel==='role')setRole(e.target.value);});
document.addEventListener('keydown',e=>{
  const tg=e.target;if((tg&&tg.closest&&tg.closest('input,select,textarea'))||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-9]$/.test(e.key))setRole(ORDER[+e.key-1]);
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const i=ORDER.indexOf(S.role);setRole(ORDER[(i+(e.key==='ArrowRight'?1:ORDER.length-1))%ORDER.length]);}
  else if(e.key==='Escape'&&S.menu){S.menu=false;render(true);}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(true),150);});
render();
</script>
</body>
</html>
